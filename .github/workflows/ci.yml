name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and governance tests
        run: npm test

      - name: Architecture governance
        run: npm run check:governance

      - name: Contract validation
        run: npm run check:contracts

      - name: Migration validation
        run: node scripts/check-migrations.mjs

      - name: Roadmap freshness
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-roadmap.mjs

      - name: Secret scan
        run: |
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|sk_live_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{20,})' -- . ':!scripts/check-governance.mjs' ':!.github/workflows/ci.yml'; then
            echo "Potential secret committed"; exit 1
          fi
          echo "No secret patterns found."
