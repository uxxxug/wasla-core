openapi: 3.1.0
info:
  title: WASLA CORE API
  version: 1.0.0
  description: >
    Shared operating layer for WASLA. CORE owns identity, access, organizations,
    money, subscriptions, reputation, channels, notifications and fulfillment
    coordination.

    CORE never returns MOVE- or MARKET-owned data. An endpoint here that
    proxies a driver, a job's operational detail, a product or a store is an
    architecture violation (ADR 0007 / ADR 0018).

    Compatibility: additive changes only within v1. A breaking change ships as
    /v2 and v1 stays served for the documented overlap window.

    Authorization: every endpoint below except /health, /ready and /metrics
    requires `Authorization: Bearer <session token>` — one scheme and one token,
    sent once. A repeated or malformed `Authorization` header is refused with 400
    `invalid_request` at the edge rather than being narrowed to one of the values
    sent; an unknown scheme or an invalid token is 401 `unauthenticated`.

    Every endpoint accepts the `x-correlation-id` request header described in
    components/parameters/CorrelationId. Headers CORE does not read are ignored.

    Rate limiting: every endpoint below except /health, /ready and /metrics is
    rate limited at the HTTP edge, per credential and per route class, and may
    answer 429 with `retry-after`. A refused request changes no state. Allowed
    responses also carry x-ratelimit-limit, -remaining and -reset so a client can
    slow down before it is refused. See docs/observability.md.
servers:
  - url: https://core.wasla.internal
    description: Service-to-service base URL (environment supplied)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Liveness probe
      security: []
      responses:
        "400": { $ref: "#/components/responses/UnlimitedError" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Readiness probe
      security: []
      responses:
        "503": { $ref: "#/components/responses/NotReady" }
        "400": { $ref: "#/components/responses/UnlimitedError" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
          description: Ready to serve, with pending outbox depth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /v1/identities:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Resolve or create an identity from a channel account
      description: >
        Idempotent by (channel_type, external_id). A repeated call returns the
        same identity with 200 and emits no further event. This endpoint NEVER
        merges two existing identities; merging is an explicit gated operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_type, external_id]
              properties:
                channel_type:
                  $ref: "#/components/schemas/ChannelType"
                external_id: { type: string, minLength: 1 }
                display_name: { type: string, nullable: true }
                source_system: { type: string }
                legacy_id: { type: string, nullable: true }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Existing identity resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Issue a session for a principal
      description: >
        Issues a bearer token for a named principal. This is not a login
        endpoint: the caller decides that another principal's credential may
        exist, so it must hold `session.issue` — `platform_admin`, or the
        `service` credential of the channel adapter that authenticated the
        person on its own channel. Until milestone 31 this operation required no
        credential at all and would mint a working administrator token for any
        `principal_id` a caller had seen (B-39).


        `403` therefore means the caller is authenticated and may not issue
        sessions, and `404` means it may and the principal does not exist —
        which is only reachable by a caller already entitled to issue.


        The first credential of an environment cannot come from here, by
        construction. It is provisioned with `npm run bootstrap:credential`,
        which requires database access rather than an HTTP request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, channel_type]
              properties:
                principal_id: { type: string, format: uuid }
                channel_type: { $ref: "#/components/schemas/ChannelType" }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Session issued. The token is returned once and stored only as a hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/current:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Verify the caller's session and resolve the acting principal
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Authenticated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedPrincipal" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/sessions/revoke:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Revoke a session
      description: >
        Ends a session. The caller's own session needs no permission — logging
        out is not an administrative act. Any other principal's session needs
        `identity.write`, and a caller without it is refused with `403` whether
        the `session_id` names a real session or an invented one, so the refusal
        cannot be used to discover session ids. `404` is reachable only by a
        caller holding `identity.write`.


        Until milestone 31 this operation took no credential: it ended any named
        session for anybody (B-40), and for a well-formed id that did not exist
        it answered `204` and then killed the process, because the revocation
        was not awaited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "204":
          description: Revoked (idempotent)
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/access/check:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Authorization probe for MOVE and MARKET
      description: >
        Returns an allow/deny decision only. It never returns the data the
        permission would guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: { $ref: "#/components/schemas/Permission" }
                organization_id: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  principal_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/memberships:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Grant a principal membership of an organization
      description: |
        Requires `organization.write` on `organization_id`: `platform_admin`
        everywhere, `org_admin` inside its own tenant. Until milestone 29 this
        route required no credential at all, which made an anonymous
        `POST /v1/identities` followed by this call and `POST /v1/sessions` a full
        escalation into any organization whose id the caller knew.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, organization_id, roles]
              properties:
                principal_id: { type: string, format: uuid }
                organization_id: { type: string, format: uuid }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Membership granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/organizations:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      summary: Create an organization (tenant)
      description: >
        An organization is identified by the id CORE mints and by nothing
        else: two organizations may share a name and a country, so a repeat of
        this call creates a second tenant that no later read can tell from the
        first. Measured on main at bd92b69, it did exactly that.


        Retry safety, milestone 32. This route has no natural key that would
        make a repeat harmless, so it requires an `Idempotency-Key` header: a
        caller-chosen identifier, letters, digits and `. _ : -`, at most 128
        characters. **This is a breaking change** — a request without the
        header is refused with 400 `invalid_request`, and before milestone 32
        the header was ignored.


        CORE records this route's answer under the key together with a
        fingerprint of the request (its method, its route template and its
        parsed body). Sending the same key again with the same body returns the
        recorded status and body unchanged, with `idempotent-replay: true`, and
        creates nothing. Sending the same key with a different body is refused
        with 409 `conflict`, because the caller would otherwise be told a
        request it never made had succeeded. A refusal is never recorded, so a
        request rejected as invalid may be corrected and sent again under the
        same key. A record is replayed for 24 hours; after that the key is free
        again. The key is scoped to this route, so the same string used on a
        different route is a different record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string, minLength: 1 }
                country_code: { type: string, pattern: "^[A-Z]{2}$" }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
            idempotent-replay: { $ref: "#/components/headers/IdempotentReplay" }
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/KeyReused" }
  /v1/organizations/{organization_id}:
    get:
      summary: Read an organization the caller belongs to
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallets:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Create or resolve a CORE-owned wallet
      description: Idempotent by owner type, owner id and ISO 4217 currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, currency]
              properties:
                owner_type: { type: string, enum: [identity, organization] }
                owner_id: { type: string, format: uuid }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Wallet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "200": { description: Existing wallet resolved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/wallets/{wallet_id}/balance:
    get:
      summary: Read posted, held and available wallet amounts
      description: >-
        held_minor counts only holds that are still capturable. A hold past its
        expiry can no longer be captured, so its amount is reported separately
        in expired_hold_minor and is already spendable; the expiry sweep then
        releases it formally.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: wallet_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Balance in integer minor units
          content:
            application/json:
              schema:
                type: object
                required: [posted_minor, held_minor, available_minor, expired_hold_minor]
                properties:
                  posted_minor: { type: integer }
                  held_minor: { type: integer, minimum: 0 }
                  available_minor: { type: integer }
                  expired_hold_minor:
                    type: integer
                    minimum: 0
                    description: Amount still recorded as authorized but past expiry, awaiting the sweep.
        "404": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Place an idempotent hold on wallet funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_id, amount_minor, business_reference]
              properties:
                wallet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                business_reference: { type: string, minLength: 1 }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Payment authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAuthorization" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/capture:
    post:
      summary: Capture against an authorized payment into the balanced ledger
      description: >
        amount_minor is the amount to capture; omitting it captures the whole
        remaining hold, which is what this route has always meant. A smaller
        amount leaves the rest held and capturable, so the authorization stays
        open until the amount the payer consented to is reached. A partial
        capture MUST carry capture_reference: it is by definition one of
        several, and a key derived from the authorization alone cannot tell a
        retry from an additional capture, so CORE refuses instead of guessing.
        Capturing more than remains is refused because the authorization is a
        consent, not a balance.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_minor: { type: integer, minimum: 1 }
                capture_reference:
                  type: string
                  minLength: 1
                  description: Caller's idempotency key. Required for a partial capture.
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Capture transaction, idempotent on the capture reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerTransaction" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/refund:
    post:
      summary: Return money that has already been captured
      description: >
        A refund is not a void and not an un-capture. A void releases money
        that never left the wallet and posts nothing; a refund posts a balanced
        reversal of money that did leave. The authorization keeps its captured
        status and the hold is not restored - the funds simply become spendable
        again. The limit is what was captured, not what was held. Omitting
        amount_minor refunds everything still refundable. refund_reference is
        always required, because there is no "the" refund of an authorization
        and therefore no key CORE could derive to make a retry safe.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refund_reference, reason]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                refund_reference: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Refund transaction, idempotent on the refund reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerTransaction" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/void:
    post:
      summary: Release whatever is still held, without moving money
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: >
            Authorization closed, idempotent. Closes as voided when nothing was
            captured, and as partially_captured when some money had already
            moved - calling that one voided would claim nothing moved when
            something did. Only the uncaptured remainder is released.
          content:
