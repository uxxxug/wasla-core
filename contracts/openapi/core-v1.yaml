  /v1/plans/{plan_id}/retire:
    post:
      summary: Stop new subscriptions to a plan without touching existing ones
      description: >
        Retiring closes the plan to new subscribers only. Subscriptions already
        on it keep renewing at the price their periods record, because the
        period is the invoice and carries its own amount. Retirement is
        one-way: reviving a plan would silently reopen terms that were
        withdrawn.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
