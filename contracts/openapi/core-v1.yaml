            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Fulfillment already closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/events:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Submit an event from MARKET or MOVE for durable ingestion
      description: >-
        The edge external systems push into. CORE records the envelope durably
        and returns 202 without processing it; an inbound dispatcher hands it to
        the consumers afterwards, so a crash after the response loses nothing.
        Redelivering the same event_id is safe and returns first_delivery=false.

        Which event types a caller may submit is derived from the authenticated
        credential, not from the request. A caller may only submit events whose
        type carries its own prefix, and no external caller may submit core.*
        events at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventEnvelope" }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "202":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Event accepted and recorded durably
          content:
            application/json:
              schema:
                type: object
                required: [event_id, accepted, first_delivery]
                properties:
                  event_id: { type: string, format: uuid }
                  accepted: { type: boolean }
                  first_delivery:
                    type: boolean
                    description: False when CORE already held this event; no retry needed.
        "400":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: "Invalid envelope, or no consumer for this event type"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: This caller may not submit this event type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/event-subscriptions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register where CORE should deliver one of its own event types
      description: >-
        Operator-provisioned only; there is no self-registration. Only core.*
        event types may be subscribed to, because a subscription to market.* or
        move.* would hand one external system another's inbound traffic by
        configuration alone. The endpoint must be https, and the signing secret
        is never returned by any read path including this one.

        Re-registering an existing (subscriber, event_type) returns the existing
        subscription and does not rotate its secret: silently rotating would
        break every in-flight delivery without anyone asking for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriber, event_type, endpoint_url, signing_secret]
              properties:
                subscriber:
                  type: string
                  description: The external system, normally its service credential name.
                event_type: { type: string, pattern: "^core\\." }
                endpoint_url: { type: string, format: uri, pattern: "^https://" }
                signing_secret:
                  type: string
                  minLength: 32
                  description: >-
                    Shared secret CORE signs each body with. Write-only; stored
                    because HMAC needs the plaintext, never echoed, never logged.
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Subscription registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSubscription" }
        "400":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: "Not a core.* type, not https, or secret too short"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: List the endpoints CORE delivers events to
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Subscriptions, without their secrets
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventSubscription" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
