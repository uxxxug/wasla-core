                correlation_id: { type: string }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Recipient deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRecipient" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Recipient not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/notifications:
    get:
      summary: Inspect what people have been told, and what is stuck
      description: >-
        One list with filters plus the counts an operator watches, including the
        derived `retrying` state (a pending row that has already been attempted).
        There is deliberately no /pending, /failed or /retrying path: they are the
        same question with a different filter.

        This does not overlap /v1/event-deliveries/undelivered, which answers
        whether a subscribing *system* received an event. This answers whether a
        *person* was told.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [pending, processing, accepted, delivered, failed] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Notifications, newest first, with counts by state
          content:
            application/json:
              schema:
                type: object
                required: [count, summary, items]
                properties:
                  count: { type: integer }
                  summary:
                    type: object
                    description: >-
                      Row counts per state, plus the derived retrying count.
                      Named one by one rather than declared as free-form integer
                      keys: a state added to the notification machine has to be
                      published here before it can appear in a response.
                    required:
                      [pending, processing, accepted, delivered, failed, retrying]
                    properties:
                      pending: { type: integer }
                      processing: { type: integer }
                      accepted: { type: integer }
                      delivered: { type: integer }
                      failed: { type: integer }
                      retrying:
                        type: integer
                        description: >-
                          Derived, not a state: failed rows whose attempt budget
                          is not spent and which will be tried again.
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "400":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Unknown status or out-of-range limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /metrics:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Operational metrics in Prometheus text exposition format
      description: >
        System-level operational metrics: ingress volume, latency and status
        distribution, rate-limit refusals, worker claims and outcomes, queue
        depth, and the size of the reconciliation queues.

        Deliberately system-level only. No metric carries an organization or an
        entity dimension, so the exposition contains no tenant data, no
        identifier, no address and no credential — a count alone would otherwise
        reveal that a particular tenant exists and is in trouble. Per-tenant
        operational answers are served by the authorized reconciliation and
        delivery endpoints instead. See docs/observability.md.

        The scrape performs no query and changes no state; the queue-depth gauges
        are refreshed by a sampler on the operator's own cadence and carry
        core_sample_timestamp_seconds so their age is visible. Never rate
        limited, like the liveness probes. Unauthenticated, which requires the
        endpoint to stay on an internal network until the deployment topology is
        decided (blocker B-5).
      security: []
      responses:
        "400": { $ref: "#/components/responses/UnlimitedError" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            access-control-allow-origin:
              description: >
                Allows a browser dashboard on a different origin to read the
                metrics exposition. The endpoint is unauthenticated and carries
                no tenant data (B-5), so any origin may read it.
              schema: { type: string, enum: ["*"] }
            access-control-allow-methods:
              description: >
                Names GET as the only method the /metrics route serves.
              schema: { type: string, enum: ["GET"] }
          description: Prometheus exposition, version 0.0.4. Deterministic for unchanged state.
          content:
            text/plain:
              schema: { type: string }

  /v1/reputation/{subject_type}/{subject_id}:
    get:
      summary: Read the derived standing of an identity or organization
      description: >
        Every number in the response is derived from the recorded signals at the
        moment of the read; no standing, score or average is stored anywhere in
        CORE. average_rating_milli is thousandths of a rating point and is null
        when the subject has no standing rating, which is not the same as a zero.
        Retracted signals are counted as retracted and count towards nothing
        else. CORE does not weight kinds, age signals or decide what standing is
        good enough for anything: those are product policy and are recorded as
        blockers in ROADMAP.md rather than invented here. There is no route that
        writes a signal - signals arrive only as events from the systems that
        observed them (ADR 0008, ADR 0015).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subject_type
          in: path
          required: true
          schema: { type: string, enum: [identity, organization] }
        - name: subject_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organization_id
          in: query
          required: true
          description: >
            The tenant of the read, stated rather than inferred from the
            caller's memberships: a principal can belong to several
            organizations, and inferring would mean CORE choosing which tenant an
            ambiguous read meant.
          schema: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: The derived standing, with per-kind counts and the standing rating average.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationStanding" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/reputation/{subject_type}/{subject_id}/signals:
    get:
      summary: List the signals a standing is derived from
      description: >
        Newest first by CORE's own recorded_at, so one producer's clock skew
        cannot reorder another's facts. Bounded by limit, because an unbounded
        listing of a long history is a request whose cost nobody chose. Exists so
        a support agent can see what a number is made of instead of having to
        believe it; no review text ever reaches CORE, so none appears here.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subject_type
          in: path
          required: true
          schema: { type: string, enum: [identity, organization] }
        - name: subject_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: The recorded signals, newest first, each stating whether and when it was retracted.
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReputationSignal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: >
        The caller's trace id for this request. CORE echoes it in the response,
        writes it to the request log and persists it as the `correlation_id` of
        every audit, outbox, ledger, inbound-event, notification and subscription
        row the request creates, so it is accepted only as an identifier:
        letters, digits and `. _ : -`, at most 128 characters, sent at most once.
        Anything else is refused with 400 `invalid_request` before the route is
        matched, before the rate limiter runs and before any state is touched;
        the refusal carries a CORE-generated id rather than echoing the rejected
        value. Omit the header and CORE generates a UUID v4 for the request.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      description: >
        The caller's retry key, required by every operation that references
        this parameter and read by no other. Those operations create something
        that has no natural key, so without a key from the caller CORE cannot
        tell a retry from a second request: milestone 32 measured a repeat of
        each of them creating a second organization, city, service area or
        subscription. Accepted as an identifier — letters, digits and
        `. _ : -`, at most 128 characters, sent at most once — because it
        becomes the key of a stored record; anything else is refused with 400
        `invalid_request`. Any value a caller can generate once and resend with
        the retry works: a UUID, a ULID, or its own order id.


        CORE stores the answer under the key together with a fingerprint of the
        request, and replays that answer, unchanged and marked
        `idempotent-replay: true`, for 24 hours. The key is scoped to one
        route, so the same string on two routes is two records. Reusing it with
        a different body is 409; a refused request is not recorded, so
        correcting the body and resending under the same key runs normally.
  headers:
    CorrelationId:
      description: >
        CORE's own record of this request, echoed from the request's
        `x-correlation-id` when one was sent and generated when none was. It is
        the value written to every audit, outbox, ledger, inbound-event,
        notification and subscription row the request touched, so a caller that
        keeps it can ask CORE afterwards what the request did and be answered
        from CORE's own tables. Set on every response CORE produces, including
        the ones it could not route and the ones it refused before reading the
        request.
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
    RateLimitLimit:
      description: >
        Requests allowed per window for the class this route belongs to. Sent on
        every response produced while a limiter is wired, successes included, so
        a caller learns its budget before it is refused rather than from the
        refusal. Absent — not zero — where no limiter is configured.
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: Requests left in the current window after this one; 0 on a refusal.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Unix time in seconds at which the current window ends.
      schema: { type: integer }
    IdempotentReplay:
      description: >
        Present, with the value `true`, only when CORE answered from the record
        of an earlier identical request rather than by doing the work again:
        the status and body are the ones the first call received, and this call
        created nothing. Absent on a first call — never sent as `false`, so a
        caller tests for the header rather than for its value.
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: >
        Whole seconds until this exact request may be resent unchanged, minimum 1
        (RFC 9110). Sent only on a refusal that comes good on its own.
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Canonical error
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
        x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnlimitedError:
      description: >
        The canonical error, answered by a route that is never rate limited, so
        it carries the correlation header and none of the budget headers.


        Added by milestone 36. `/health`, `/ready` and `/metrics` are on
        `UNLIMITED_ROUTES` — throttling a liveness check makes a healthy
        deployment look unhealthy for the wrong reason, and throttling the
        scraper blinds the monitoring exactly when a flood is in progress — so
        they cannot answer 429 and never send `x-ratelimit-*`. Referencing the
        shared `Error` here would document three headers CORE does not set on
        these routes, which milestone 28's gate compares against real answers.
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: >
        CORE is up and cannot serve yet: the dependency the readiness probe
        checks did not answer. `code` is `unavailable` and `retryable` is true,
        with no `retry-after` — CORE does not know when its dependency recovers,
        and stating a time it cannot know would be worse than stating none
        (milestone 34).


        Added by milestone 37, together with the behaviour it documents. Until
        then this failure escaped the handler and the router's fail-closed
        default rendered it as `500` `internal`: CORE telling an orchestrator
        that CORE has a defect, when what had happened is that CORE could not
        serve. An orchestrator reading `500` from a readiness probe has grounds
        to stop rolling out; reading `503` it waits. `details` names the
        persistence backend and the dependency's own message, which is what an
        operator needs and is not the same as leaking a stack.


        Carries the correlation header and none of the budget headers: `/ready`
        is on `UNLIMITED_ROUTES`.
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: >
        No credential, or one CORE does not accept. `code` is `unauthenticated`
        and `retryable` is false: repeating the identical request will not
        change the answer.


        This refusal comes first. It is decided at the HTTP edge from the
        route's own declaration, before the query string is parsed, before the
        body is parsed and before any handler runs — so a caller without a
        credential is told that and nothing else. It does not learn whether its
        body was well formed, which property it misspelled, or whether the
        identifier in its path names anything that exists: `401` is the answer
        for a real identifier and an invented one alike.


        A request refused here has changed nothing and read nothing about the
        entity it named. A request carrying no `authorization` header at all is
        refused without a single database read.
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
        x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyReused:
      description: >
        The request conflicts with state CORE already holds, and the canonical
        error body says which. On a route that requires an `Idempotency-Key`
        this is also the answer when the key was already used with a
        *different* request: CORE refuses rather than replaying the earlier
        answer, because telling a caller that a request it never made had
        succeeded is worse than refusing the one it did make. The stored answer
        is left exactly as it was, so a retry of the original request still
        replays it.

        Since milestone 33 it is also the answer when the *identical* request is
        still in flight under that key: CORE claims the key before it runs the
        handler, so of two concurrent twins one does the work and the other is
        refused here with `code` `conflict`, `details.claimed_at` saying when
        the winner took the key, and `retry-after` saying how long to wait
        before asking again. The refused twin changed nothing. This is
        deliberately a refusal and not a wait: the caller learns that its
        request is being handled, rather than being held on an open connection
        for an answer whose arrival would depend on timing. Resending the
        identical request after `retry-after` replays the winner's answer, which
        is what the key was for.

        `retryable` and `retry-after` agree on this response and always will:
        since milestone 34 a refusal states its retry time once and both the
        header and the flag are rendered from it, so an in-flight refusal is
        `retryable: true` with a `retry-after`, and a reuse refusal is
        `retryable: false` with none. Until then the flag was derived from
        `code` alone and reported `false` here while the header said otherwise,
        which was recorded as a blocker rather than papered over, and is now
        closed. A caller may key on either; they cannot disagree.
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
        x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
        # Sent on the in-flight refusal only, and exactly when `retryable` is
        # true. A reuse refusal never comes good on its own — the key is spent
        # and the body will not match — so it carries neither the header nor
        # the flag, and the header is optional here for exactly that reason.
        retry-after: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >
        Too many requests from this credential for this route class within the
        current window. The request was refused at the HTTP edge before any
        handler ran, so it changed no state at all: no fulfillment, no ledger
        entry, no outbox or inbound row, no notification, no audit entry, and no
        idempotency consumed. `code` is `rate_limited` and `retryable` is true —
        distinct from `unavailable`, so a caller can tell "wait" from "broken".
        Wait for `retry-after` and resend the identical request.
      headers:
        x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
        retry-after: { $ref: "#/components/headers/RetryAfter" }
        x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
        x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    NotificationRecipient:
      type: object
      description: Who CORE tells about one event type, on which channel.
      required: [recipient_id, event_type, identity_id, channel, active, created_at]
      properties:
        recipient_id: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }
        event_type: { type: string }
        identity_id: { type: string, format: uuid }
        channel: { type: string, enum: [telegram, email, phone] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      description: >-
        One message to one person about one event. `accepted` means a provider
        took it; `delivered` means a provider confirmed it reached the recipient,
        which no adapter can report yet (dependency D-8). The distinction is kept
        in the model rather than collapsed, so a future provider callback does not
        require a migration of meaning.
      required:
        [notification_id, event_id, recipient_id, channel, template, status, attempts, created_at]
      properties:
        notification_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        recipient_id: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [telegram, email, phone] }
        address:
          type: string
          nullable: true
          description: Null only on a row born failed because the channel was unroutable.
        template: { type: string }
        subject: { type: string }
        body: { type: string }
        data: { type: object }
        idempotency_key:
          type: string
          description: >-
            event_id:recipient_id. Stable across retries and across dispatcher
            restarts, and passed to the adapter so a cooperating provider can
            collapse a repeat.
        status:
          type: string
          enum: [pending, processing, accepted, delivered, failed, retrying]
          description: >-
            `retrying` is derived, not stored: a pending row with attempts > 0.
        attempts: { type: integer }
        last_error:
          type: string
          nullable: true
          description: Provider failure reason, with secrets and addresses redacted.
        provider_message_id: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
    EventSubscription:
      type: object
      description: >-
        Where CORE delivers one event type. signing_secret is deliberately
        absent: it is write-only and never leaves the database.
      required: [subscription_id, subscriber, event_type, endpoint_url, active, created_at]
      properties:
        subscription_id: { type: string, format: uuid }
        subscriber: { type: string }
        event_type: { type: string }
        endpoint_url: { type: string, format: uri }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    EventDelivery:
      type: object
      description: One attempt record per (event, subscription). The unit of outbound work.
      required:
        [delivery_id, event_id, subscription_id, status, attempts, next_attempt_at, created_at]
      properties:
        delivery_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, delivered, dead]
          description: >-
            dead means CORE stopped trying: either the receiver refused the
            payload, or the attempt budget ran out.
        attempts: { type: integer }
        last_error: { type: string, nullable: true }
        last_status:
          type: integer
          nullable: true
          description: Null when the attempt never got a response at all.
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        claimed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a worker claimed this delivery, or null when nobody holds it
            (B-24). While it is set, next_attempt_at is a lease expiry rather
            than a retry schedule.
        reclaims:
          type: integer
          description: >-
            How many times a worker claimed this delivery and never came back
            (B-25). Counted apart from attempts, which counts responses the
            subscriber actually gave.
        # The claim token is deliberately absent, for the reason
        # EventSubscription has no signing_secret: it is a fencing credential a
        # worker presents to acknowledge work, and CORE stopped returning it in
        # milestone 27.
    EventEnvelope:
      type: object
      description: >-
        The canonical envelope every event carries, inbound and outbound. The
        payload shape per event_type is published under contracts/events.
      required:
        [event_id, event_type, version, producer, occurred_at, correlation_id,
         entity_type, entity_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          description: >-
            Accepted from external callers: market.order.created,
            move.job.accepted, move.job.rejected, move.job.completed.
        version: { type: integer, minimum: 1 }
        producer:
          type: string
          description: Must equal the authenticated caller's service name.
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string }
        causation_id: { type: [string, "null"] }
        entity_type: { type: string }
        entity_id: { type: string }
        payload: { type: object }
    ChannelType:
      type: string
      enum: [telegram, phone, email, web, partner_api]
    Role:
      type: string
      enum: [platform_admin, org_admin, org_member, support_agent, service]
    Permission:
      type: string
      enum:
        - identity.read
        - identity.write
        - organization.read
        - organization.write
        - fulfillment.request
        - fulfillment.read
        - money.authorize
        - support.act
        # Added in milestone 27: CORE has issued these since the eventing,
        # subscription and reputation modules shipped, and the published list
        # stopped short at support.act — so a client validating the principal
        # CORE returned against this contract would have rejected CORE's own
        # answer. Kept in the order ROLE_PERMISSIONS grants them.
        - events.submit
        - events.replay
        - events.revive
        - subscription.read
        - subscription.write
        - reputation.read
        - session.issue
    IdentityResolved:
      type: object
      required: [identity_id, principal_id, status, created]
      properties:
        identity_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, merged] }
        created: { type: boolean }
    AuthenticatedPrincipal:
      type: object
      required: [principal_id, identity_id, session_id, organization_ids, roles, permissions]
      properties:
        principal_id: { type: string, format: uuid }
        identity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        organization_ids:
          type: array
          items: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        service_name:
          type: string
          nullable: true
          description: >-
            The system this credential speaks for, or null for a human principal.
            It is what `POST /v1/events` compares a submitted event's producer
            against, so a caller can see which system CORE believes it is.
    Organization:
      type: object
      required: [organization_id, name, status, country_code]
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        country_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source_system: { type: string }
        legacy_id: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message, retryable, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              forbidden,
              not_found,
              conflict,
              rate_limited,
              unavailable,
              internal,
            ]
        message: { type: string }
        details: { type: object }
        retryable: { type: boolean }
        correlation_id: { type: string }
    # ── shapes added by milestone 27 ──────────────────────────────────────────
    # Every schema below was written from a response CORE actually produced,
    # measured over its own router by tests/support/http-scenario.ts, and is
    # checked against that response on every run by
    # tests/http-response-declaration.test.ts. A property documented here that
    # CORE does not return, or a property CORE returns that is not documented
    # here, fails that gate.
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      description: >-
        outbox_pending is the depth an operator should expect to be zero or
        falling; persistence names the backend serving this process.
      required: [status, persistence, outbox_pending]
      properties:
        status: { type: string, enum: [ready] }
        persistence: { type: string, enum: [memory, postgres] }
        outbox_pending: { type: integer }
    Membership:
      type: object
      required: [membership_id, principal_id, organization_id, roles, created_at]
      properties:
        membership_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Wallet:
      type: object
      required: [wallet_id, owner_type, owner_id, currency, status, created_at]
      properties:
        wallet_id: { type: string, format: uuid }
        owner_type: { type: string, enum: [identity, organization] }
        owner_id: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [active, frozen, closed] }
        created_at: { type: string, format: date-time }
    PaymentAuthorization:
      type: object
      description: >-
        A hold. captured_minor and refunded_minor are cumulative across the split
        captures migration 0009 allows, so a partially captured hold reports both
        the ceiling consented to and the part that moved.
      required:
        [
          authorization_id,
          wallet_id,
          amount_minor,
          captured_minor,
          refunded_minor,
          currency,
          status,
          business_reference,
          created_at,
        ]
      properties:
        authorization_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        captured_minor: { type: integer }
        refunded_minor: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [authorized, captured, partially_captured, voided]
        business_reference: { type: string }
        created_at: { type: string, format: date-time }
        captured_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true }
    LedgerEntry:
      type: object
      required: [entry_id, transaction_id, account_reference, amount_minor, currency]
      properties:
        entry_id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid }
        account_reference: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
    LedgerTransaction:
      type: object
      description: >-
        A balanced double entry. The entries of one transaction always sum to
        zero; a capture moves the payer's money to a clearing account and a
        refund moves it back.
      required: [transaction_id, kind, business_reference, occurred_at, entries]
      properties:
        transaction_id: { type: string, format: uuid }
        kind: { type: string }
        authorization_id: { type: string, format: uuid, nullable: true }
        business_reference: { type: string }
        occurred_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
    PlanGrant:
      type: object
      description: >-
        What a plan entitles per period. limit_value null is an unmetered grant,
        which is not the same as an absent grant.
      required: [plan_id, feature_key, limit_value]
      properties:
        plan_id: { type: string, format: uuid }
        feature_key: { type: string }
        limit_value: { type: integer, nullable: true }
    Plan:
      type: object
      required:
        [
          plan_id,
          code,
          name,
          currency,
          amount_minor,
          billing_interval,
          interval_count,
          status,
          created_at,
        ]
      properties:
        plan_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        currency: { type: string }
        amount_minor: { type: integer }
        billing_interval: { type: string, enum: [day, week, month, year] }
        interval_count: { type: integer }
        status: { type: string, enum: [draft, active, retired] }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }
        grants:
          type: array
          items: { $ref: "#/components/schemas/PlanGrant" }
    SubscriptionPeriod:
      type: object
      description: >-
        One billing window. authorization_id names the hold that settled it;
        uncollectible_reason is set only when CORE could not collect and says so
        rather than retrying forever.
      required:
        [
          period_id,
          subscription_id,
          sequence,
          starts_at,
          ends_at,
          currency,
          amount_minor,
          status,
          created_at,
        ]
      properties:
        period_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        sequence: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        currency: { type: string }
        amount_minor: { type: integer }
        status: { type: string, enum: [pending, settled, uncollectible, voided] }
        authorization_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        settled_at: { type: string, format: date-time, nullable: true }
        uncollectible_reason: { type: string, nullable: true }
    Subscription:
      type: object
      required:
        [subscription_id, owner_type, owner_id, plan_id, wallet_id, status, created_at]
      properties:
        subscription_id: { type: string, format: uuid }
        owner_type: { type: string, enum: [identity, organization] }
        owner_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        status: { type: string, enum: [active, past_due, cancelled, expired] }
        created_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
    UsageRecord:
      type: object
      description: >-
        Idempotent by usage_reference, so a repeated report is counted once.
      required:
        [usage_id, period_id, feature_key, quantity, usage_reference, recorded_at]
      properties:
        usage_id: { type: string, format: uuid }
        period_id: { type: string, format: uuid }
        feature_key: { type: string }
        quantity: { type: integer }
        usage_reference: { type: string }
        recorded_at: { type: string, format: date-time }
        correlation_id: { type: string }
    Country:
      type: object
      required: [country_code, name, default_currency, status]
      properties:
        country_code: { type: string, minLength: 2 }
        name: { type: string }
        default_currency: { type: string }
        status: { type: string, enum: [active, inactive] }
    Region:
      type: object
      required: [region_id, country_code, code, name, status]
      properties:
        region_id: { type: string, format: uuid }
        country_code: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
    City:
      type: object
      required: [city_id, region_id, country_code, name, latitude, longitude, status]
      properties:
        city_id: { type: string, format: uuid }
        region_id: { type: string, format: uuid }
        country_code: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [active, inactive] }
    ServiceArea:
      type: object
      required:
        [
          service_area_id,
          city_id,
          country_code,
          name,
          centre_latitude,
          centre_longitude,
          radius_metres,
          status,
        ]
      properties:
        service_area_id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        country_code: { type: string }
        name: { type: string }
        centre_latitude: { type: number }
        centre_longitude: { type: number }
        radius_metres: { type: integer }
        status: { type: string, enum: [active, inactive] }
    ServiceAreaMatch:
      type: object
      required: [service_area, distance_metres]
      properties:
        service_area: { $ref: "#/components/schemas/ServiceArea" }
        distance_metres: { type: integer }
    Fulfillment:
      type: object
      description: >-
        CORE's coordination record for one market order. It holds references to
        MARKET and MOVE work, never their data (ADR 0007 / ADR 0018).
        financial_disposition is derived, not stored, and says which queue a
        fulfillment belongs to when its money is not finished.
      required:
        [
          fulfillment_id,
          organization_id,
          market_order_reference,
          move_job_reference,
          payment_authorization_id,
          status,
          settlement_state,
          created_at,
          completed_at,
          closure_reason,
          executed_after_cancellation_at,
          executed_after_cancellation_job_reference,
          financial_disposition,
        ]
      properties:
        fulfillment_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        market_order_reference: { type: string }
        move_job_reference: { type: string, nullable: true }
        payment_authorization_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [coordinating, dispatched, completed, failed, cancelled]
        settlement_state:
          type: string
          enum: [none, held, captured, partially_captured, released, unsettled]
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        closure_reason: { type: string, nullable: true }
        executed_after_cancellation_at: { type: string, format: date-time, nullable: true }
        executed_after_cancellation_job_reference: { type: string, nullable: true }
        financial_disposition:
          type: string
          enum: [no_money, awaiting_execution, settled, decision_required, inconsistent]
    StaleHold:
      type: object
      description: >-
        Open work whose hold can no longer settle it. Reporting only:
        settlement_state_if_closed is what the settlement WOULD become if this
        fulfillment closed now, so an operator can see which cases will need the
        decision blocker B-20 records as unmade.
      required: [fulfillment, reason, hold_captured_minor, settlement_state_if_closed]
      properties:
        fulfillment: { $ref: "#/components/schemas/Fulfillment" }
        reason: { type: string }
        hold_captured_minor: { type: integer }
        settlement_state_if_closed:
          type: string
          enum: [none, held, captured, partially_captured, released, unsettled]
    ReputationStanding:
      type: object
      description: >-
        Counts only, per organization. average_rating_milli is the mean rating in
        thousandths so no float rounding enters an aggregate CORE publishes;
        retracted signals are counted and excluded from the rating.
      required:
        [
          organization_id,
          subject_type,
          subject_id,
          signal_count,
          retracted_count,
          counts,
          rating_count,
          rating_sum,
          average_rating_milli,
        ]
      properties:
        organization_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [identity, organization] }
        subject_id: { type: string, format: uuid }
        signal_count: { type: integer }
        retracted_count: { type: integer }
        counts:
          type: object
          required:
            [service_rating, completion, cancellation, dispute, compliment, complaint]
          properties:
            service_rating: { type: integer }
            completion: { type: integer }
            cancellation: { type: integer }
            dispute: { type: integer }
            compliment: { type: integer }
            complaint: { type: integer }
        rating_count: { type: integer }
        rating_sum: { type: integer }
        average_rating_milli: { type: integer, nullable: true }
        first_signal_at: { type: string, format: date-time, nullable: true }
        last_signal_at: { type: string, format: date-time, nullable: true }
    ReputationSignal:
      type: object
      required:
        [
          reputation_signal_id,
          organization_id,
          subject_type,
          subject_id,
          signal_kind,
          rating_value,
          source_system,
          source_reference,
          occurred_at,
          recorded_at,
          retracted_at,
          retraction_reason,
        ]
      properties:
        reputation_signal_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [identity, organization] }
        subject_id: { type: string, format: uuid }
        signal_kind:
          type: string
          enum:
            [service_rating, completion, cancellation, dispute, compliment, complaint]
        rating_value: { type: integer, nullable: true }
        source_system: { type: string }
        source_reference: { type: string }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        correlation_id: { type: string, nullable: true }
        retracted_at: { type: string, format: date-time, nullable: true }
        retraction_reason: { type: string, nullable: true }
