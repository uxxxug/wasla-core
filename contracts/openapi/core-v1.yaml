openapi: 3.1.0
info:
  title: WASLA CORE API
  version: 1.0.0
  description: >
    Shared operating layer for WASLA. CORE owns identity, access, organizations,
    money, subscriptions, reputation, channels, notifications and fulfillment
    coordination.

    CORE never returns MOVE- or MARKET-owned data. An endpoint here that
    proxies a driver, a job's operational detail, a product or a store is an
    architecture violation (ADR 0007 / ADR 0018).

    Compatibility: additive changes only within v1. A breaking change ships as
    /v2 and v1 stays served for the documented overlap window.
servers:
  - url: https://core.wasla.internal
    description: Service-to-service base URL (environment supplied)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
  /ready:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready to serve, with pending outbox depth
  /v1/identities:
    post:
      summary: Resolve or create an identity from a channel account
      description: >
        Idempotent by (channel_type, external_id). A repeated call returns the
        same identity with 200 and emits no further event. This endpoint NEVER
        merges two existing identities; merging is an explicit gated operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_type, external_id]
              properties:
                channel_type:
                  $ref: "#/components/schemas/ChannelType"
                external_id: { type: string, minLength: 1 }
                display_name: { type: string, nullable: true }
                source_system: { type: string }
                legacy_id: { type: string, nullable: true }
      responses:
        "200":
          description: Existing identity resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "201":
          description: Identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    post:
      summary: Issue a session for a principal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, channel_type]
              properties:
                principal_id: { type: string, format: uuid }
                channel_type: { $ref: "#/components/schemas/ChannelType" }
      responses:
        "201":
          description: Session issued. The token is returned once and stored only as a hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/current:
    get:
      summary: Verify the caller's session and resolve the acting principal
      responses:
        "200":
          description: Authenticated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedPrincipal" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/sessions/revoke:
    post:
      summary: Revoke a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        "204": { description: Revoked (idempotent) }
  /v1/access/check:
    post:
      summary: Authorization probe for MOVE and MARKET
      description: >
        Returns an allow/deny decision only. It never returns the data the
        permission would guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: { $ref: "#/components/schemas/Permission" }
                organization_id: { type: string, format: uuid }
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  principal_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Error" }
  /v1/memberships:
    post:
      summary: Grant a principal membership of an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, organization_id, roles]
              properties:
                principal_id: { type: string, format: uuid }
                organization_id: { type: string, format: uuid }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Membership granted }
        "409": { $ref: "#/components/responses/Error" }
  /v1/organizations:
    post:
      summary: Create an organization (tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string, minLength: 1 }
                country_code: { type: string, pattern: "^[A-Z]{2}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organization_id}:
    get:
      summary: Read an organization the caller belongs to
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallets:
    post:
      summary: Create or resolve a CORE-owned wallet
      description: Idempotent by owner type, owner id and ISO 4217 currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, currency]
              properties:
                owner_type: { type: string, enum: [identity, organization] }
                owner_id: { type: string, format: uuid }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201": { description: Wallet created }
        "200": { description: Existing wallet resolved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/wallets/{wallet_id}/balance:
    get:
      summary: Read posted, held and available wallet amounts
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Balance in integer minor units
          content:
            application/json:
              schema:
                type: object
                required: [posted_minor, held_minor, available_minor]
                properties:
                  posted_minor: { type: integer }
                  held_minor: { type: integer, minimum: 0 }
                  available_minor: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations:
    post:
      summary: Place an idempotent hold on wallet funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_id, amount_minor, business_reference]
              properties:
                wallet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                business_reference: { type: string, minLength: 1 }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Payment authorized }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/capture:
    post:
      summary: Capture an authorized payment into the balanced ledger
      parameters:
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Capture transaction, idempotent on authorization id }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/void:
    post:
      summary: Release a hold without moving money
      parameters:
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: Authorization voided, idempotent }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/geography/countries:
    get:
      summary: List reference countries
      responses:
        "200": { description: Countries }
    post:
      summary: Register a reference country
      responses:
        "201": { description: Country registered }
        "409": { $ref: "#/components/responses/Error" }
  /v1/geography/countries/{country_code}/regions:
    get:
      summary: List regions of a country
      parameters:
        - name: country_code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Regions }
  /v1/geography/regions/{region_id}/cities:
    get:
      summary: List cities of a region
      parameters:
        - name: region_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Cities }
  /v1/geography/regions:
    post:
      summary: Register a reference region
      responses:
        "201": { description: Region registered }
  /v1/geography/cities:
    post:
      summary: Register a reference city
      responses:
        "201": { description: City registered }
  /v1/geography/service-areas:
    post:
      summary: Register a service area with a coverage radius
      responses:
        "201": { description: Service area registered }
  /v1/geography/service-areas/resolve:
    get:
      summary: Resolve a coordinate to covering service areas
      description: Reference resolution only. CORE never stores tracking, routes or driver positions.
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number }
        - name: longitude
          in: query
          required: true
          schema: { type: number }
      responses:
        "200": { description: Matching service areas ordered by distance }
        "400": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/inconsistent:
    get:
      summary: List fulfillments whose execution state disagrees with their money state
      description: >-
        Reconciliation read. Returns fulfillments where execution state and
        settlement_state do not agree — for example a closed fulfillment whose
        hold could not be brought to a terminal state (settlement_state
        `unsettled`). An empty list is the invariant CORE is expected to hold.
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Count and list of inconsistent fulfillments }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/{fulfillment_id}:
    get:
      summary: Read CORE fulfillment coordination state
      description: >-
        Returns opaque cross-system references, never order or job details.
        `status` is the execution state and `settlement_state` is its financial
        counterpart (none, held, captured, released, unsettled).
      parameters:
        - name: fulfillment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Fulfillment coordination record }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/{fulfillment_id}/cancel:
    post:
      summary: Cancel a fulfillment before execution closes (idempotent)
      parameters:
        - name: fulfillment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200": { description: Cancelled fulfillment }
        "409": { description: Fulfillment already closed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Canonical error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ChannelType:
      type: string
      enum: [telegram, phone, email, web, partner_api]
    Role:
      type: string
      enum: [platform_admin, org_admin, org_member, support_agent, service]
    Permission:
      type: string
      enum:
        - identity.read
        - identity.write
        - organization.read
        - organization.write
        - fulfillment.request
        - fulfillment.read
        - money.authorize
        - support.act
    IdentityResolved:
      type: object
      required: [identity_id, principal_id, status, created]
      properties:
        identity_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, merged] }
        created: { type: boolean }
    AuthenticatedPrincipal:
      type: object
      required: [principal_id, identity_id, session_id, organization_ids, roles, permissions]
      properties:
        principal_id: { type: string, format: uuid }
        identity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        organization_ids:
          type: array
          items: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Organization:
      type: object
      required: [organization_id, name, status, country_code]
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        country_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source_system: { type: string }
        legacy_id: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message, retryable, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              forbidden,
              not_found,
              conflict,
              precondition_failed,
              unavailable,
              internal,
            ]
        message: { type: string }
        details: { type: object }
        retryable: { type: boolean }
        correlation_id: { type: string }
