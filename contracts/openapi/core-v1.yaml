  /v1/fulfillments/reconciliation/inconsistent:
    get:
      summary: List fulfillments whose execution state disagrees with their money state
      description: >-
        Reconciliation read. Returns fulfillments where execution state and
        settlement_state do not agree — for example a closed fulfillment whose
        hold could not be brought to a terminal state (settlement_state
        `unsettled`), or a failed or cancelled fulfillment whose hold had already
        moved part of the payer's money (`partially_captured`). An empty list is
        the invariant CORE is expected to hold.


        Each item also carries a derived `financial_disposition`
        (no_money, awaiting_execution, settled, decision_required,
        inconsistent), which says whether the case needs an engineer
        (`inconsistent`) or a business decision (`decision_required`). It is
        computed on read and never stored.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Count and list of inconsistent fulfillments
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Fulfillment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/pending-financial-decision:
    get:
      summary: List fulfillments where money moved for work that did not complete
      description: >-
        Reconciliation read for the cases waiting on a decision rather than on a
        fix: execution closed as failed or cancelled while part of the payer's
        money had already moved (`settlement_state` `partially_captured`,
        `financial_disposition` `decision_required`).


        A non-empty list is not a CORE defect. CORE has recorded the money truth
        and stopped: it does not refund the amount, does not retain it as a
        cancellation fee, and does not mark the operation settled, because
        whether any of those is correct is undecided outside CORE (blocker
        B-20). The list exists so those cases are counted and visible instead of
        being mixed with bookkeeping defects.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Count and list of fulfillments awaiting a financial decision
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Fulfillment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/stale-holds:
    get:
      summary: List open work whose money hold can no longer settle it
      description: >-
        Reconciliation read across two modules. Returns fulfillments that are
        still open while the authorization they name can no longer settle them —
        expired, voided, or captured out of band. Neither of the two reads above
        can find these, because both look only at the fulfillment row and the
        contradiction is between the fulfillment and the hold.


        This is not a false record and not a bookkeeping defect: the row says the
        work is open, which is true. It is a liveness condition, and CORE only
        reports it. Each item carries `reason` (why the hold is unusable, in the
        same vocabulary intake uses), `hold_captured_minor` (how much already
        moved), and `settlement_state_if_closed` (the settlement state this
        fulfillment would take if it closed now — which says in advance whether it
        will land in the pending-decision queue).


        CORE does not act on these. Re-authorising, abandoning the execution, or
        completing it unfunded are commercial answers CORE has not been given
        (dependency D-6), so the queue is reported and never drained
        automatically. The read mutates nothing.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Count and list of open fulfillments with an unusable hold
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaleHold" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/{fulfillment_id}:
    get:
      summary: Read CORE fulfillment coordination state
      description: >-
        Returns opaque cross-system references, never order or job details.
        `status` is the execution state and `settlement_state` is its financial
        counterpart (none, held, captured, partially_captured, released,
        unsettled). `released` asserts that no money moved; `partially_captured`
        asserts that part of the consented amount moved and the remainder was
        released.


        The response also carries a derived `financial_disposition`: no_money,
        awaiting_execution, settled, decision_required or inconsistent.
        `decision_required` means money moved for work that did not complete and
        CORE has not been told what to do with it — do not present the operation
        as refunded or as settled while it says so.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: fulfillment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Fulfillment coordination record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fulfillment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
