        "404": { $ref: "#/components/responses/Error" }

  /v1/subscriptions/{subscription_id}/cancel:
    post:
      summary: Cancel a subscription, keeping coverage to the end of a paid period
      description: >
        Cancellation is not expiry. If the current period is paid, coverage
        runs to its end and the subscription expires only then; if it was never
        paid, the period is voided and there is no coverage to keep. CORE
        applies no proration and issues no refund: what a mid-period
        cancellation is worth is a policy question with no owner decision yet,
        recorded in ROADMAP.md, and inventing one here would put money on an
        undecided rule.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Subscription cancelled. voided_period_id names the period voided when it had not been paid, otherwise null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Subscription"
                  - type: object
                    required: [voided_period_id]
                    properties:
                      voided_period_id: { type: string, format: uuid, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscriptions/{subscription_id}/usage:
    post:
      summary: Record metered usage against the period covering the instant
      description: >
        usage_reference is the reporter's idempotency key: at-least-once
        reporting counts once, and a repeat returns 200 with the original
        record rather than 201. Usage is recorded even once the grant's limit
        is passed - dropping over-quota consumption would leave the billing and
        dispute basis incomplete, and refusing further work is the entitlement
        decision's job, not the recorder's. Usage records cannot be changed or
        deleted afterwards through any route.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_key, quantity, usage_reference]
              properties:
                feature_key: { type: string, minLength: 1 }
                quantity: { type: integer, minimum: 1 }
                usage_reference: { type: string, minLength: 1 }
                at: { type: string, format: date-time }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Usage recorded for the first time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageRecord" }
        "200": { description: The same usage_reference was already recorded; the original record is returned unchanged. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscription-periods/{period_id}/collect:
    post:
      summary: Attempt to collect a billing period through the ledger
      description: >
        Used to retry a period that could not be collected, and safe to call
        any number of times: the hold's business_reference is derived from the
        period id and ledger_transaction.business_reference is UNIQUE, so the
        ledger itself refuses a second movement. A refused collection is a
