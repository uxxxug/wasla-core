openapi: 3.1.0
info:
  title: WASLA CORE API
  version: 1.0.0
  description: >
    Shared operating layer for WASLA. CORE owns identity, access, organizations,
    money, subscriptions, reputation, channels, notifications and fulfillment
    coordination.

    CORE never returns MOVE- or MARKET-owned data. An endpoint here that
    proxies a driver, a job's operational detail, a product or a store is an
    architecture violation (ADR 0007 / ADR 0018).

    Compatibility: additive changes only within v1. A breaking change ships as
    /v2 and v1 stays served for the documented overlap window.

    Authorization: every endpoint below except /health, /ready and /metrics
    requires `Authorization: Bearer <session token>` — one scheme and one token,
    sent once. A repeated or malformed `Authorization` header is refused with 400
    `invalid_request` at the edge rather than being narrowed to one of the values
    sent; an unknown scheme or an invalid token is 401 `unauthenticated`.

    Every endpoint accepts the `x-correlation-id` request header described in
    components/parameters/CorrelationId. Headers CORE does not read are ignored.

    Rate limiting: every endpoint below except /health, /ready and /metrics is
    rate limited at the HTTP edge, per credential and per route class, and may
    answer 429 with `retry-after`. A refused request changes no state. Allowed
    responses also carry x-ratelimit-limit, -remaining and -reset so a client can
    slow down before it is refused. See docs/observability.md.
servers:
  - url: https://core.wasla.internal
    description: Service-to-service base URL (environment supplied)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
  /ready:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready to serve, with pending outbox depth
  /v1/identities:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Resolve or create an identity from a channel account
      description: >
        Idempotent by (channel_type, external_id). A repeated call returns the
        same identity with 200 and emits no further event. This endpoint NEVER
        merges two existing identities; merging is an explicit gated operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_type, external_id]
              properties:
                channel_type:
                  $ref: "#/components/schemas/ChannelType"
                external_id: { type: string, minLength: 1 }
                display_name: { type: string, nullable: true }
                source_system: { type: string }
                legacy_id: { type: string, nullable: true }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Existing identity resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "201":
          description: Identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResolved" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Issue a session for a principal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, channel_type]
              properties:
                principal_id: { type: string, format: uuid }
                channel_type: { $ref: "#/components/schemas/ChannelType" }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Session issued. The token is returned once and stored only as a hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/current:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Verify the caller's session and resolve the acting principal
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Authenticated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedPrincipal" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/sessions/revoke:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Revoke a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "204": { description: Revoked (idempotent) }
  /v1/access/check:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Authorization probe for MOVE and MARKET
      description: >
        Returns an allow/deny decision only. It never returns the data the
        permission would guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: { $ref: "#/components/schemas/Permission" }
                organization_id: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  principal_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Error" }
  /v1/memberships:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Grant a principal membership of an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, organization_id, roles]
              properties:
                principal_id: { type: string, format: uuid }
                organization_id: { type: string, format: uuid }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Membership granted }
        "409": { $ref: "#/components/responses/Error" }
  /v1/organizations:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Create an organization (tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string, minLength: 1 }
                country_code: { type: string, pattern: "^[A-Z]{2}$" }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organization_id}:
    get:
      summary: Read an organization the caller belongs to
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallets:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Create or resolve a CORE-owned wallet
      description: Idempotent by owner type, owner id and ISO 4217 currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, currency]
              properties:
                owner_type: { type: string, enum: [identity, organization] }
                owner_id: { type: string, format: uuid }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Wallet created }
        "200": { description: Existing wallet resolved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/wallets/{wallet_id}/balance:
    get:
      summary: Read posted, held and available wallet amounts
      description: >-
        held_minor counts only holds that are still capturable. A hold past its
        expiry can no longer be captured, so its amount is reported separately
        in expired_hold_minor and is already spendable; the expiry sweep then
        releases it formally.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: wallet_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Balance in integer minor units
          content:
            application/json:
              schema:
                type: object
                required: [posted_minor, held_minor, available_minor, expired_hold_minor]
                properties:
                  posted_minor: { type: integer }
                  held_minor: { type: integer, minimum: 0 }
                  available_minor: { type: integer }
                  expired_hold_minor:
                    type: integer
                    minimum: 0
                    description: Amount still recorded as authorized but past expiry, awaiting the sweep.
        "404": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Place an idempotent hold on wallet funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_id, amount_minor, business_reference]
              properties:
                wallet_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                business_reference: { type: string, minLength: 1 }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Payment authorized }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/capture:
    post:
      summary: Capture against an authorized payment into the balanced ledger
      description: >
        amount_minor is the amount to capture; omitting it captures the whole
        remaining hold, which is what this route has always meant. A smaller
        amount leaves the rest held and capturable, so the authorization stays
        open until the amount the payer consented to is reached. A partial
        capture MUST carry capture_reference: it is by definition one of
        several, and a key derived from the authorization alone cannot tell a
        retry from an additional capture, so CORE refuses instead of guessing.
        Capturing more than remains is refused because the authorization is a
        consent, not a balance.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_minor: { type: integer, minimum: 1 }
                capture_reference:
                  type: string
                  minLength: 1
                  description: Caller's idempotency key. Required for a partial capture.
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Capture transaction, idempotent on the capture reference }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/refund:
    post:
      summary: Return money that has already been captured
      description: >
        A refund is not a void and not an un-capture. A void releases money
        that never left the wallet and posts nothing; a refund posts a balanced
        reversal of money that did leave. The authorization keeps its captured
        status and the hold is not restored - the funds simply become spendable
        again. The limit is what was captured, not what was held. Omitting
        amount_minor refunds everything still refundable. refund_reference is
        always required, because there is no "the" refund of an authorization
        and therefore no key CORE could derive to make a retry safe.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refund_reference, reason]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                refund_reference: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Refund transaction, idempotent on the refund reference }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payment-authorizations/{authorization_id}/void:
    post:
      summary: Release whatever is still held, without moving money
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: authorization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: >
            Authorization closed, idempotent. Closes as voided when nothing was
            captured, and as partially_captured when some money had already
            moved - calling that one voided would claim nothing moved when
            something did. Only the uncaptured remainder is released.
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/plans:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Publish a new plan as a draft, with its feature grants
      description: >
        A plan is created as a draft and its commercial terms and grants can be
        edited only while it is one. Once activated they freeze: a price that
        could be edited after anyone had subscribed would make settled history
        unreadable, because the period would say one number and the plan
        another with nothing recording which the customer agreed to. Changing a
        price means publishing a new plan. amount_minor is operator-configured
        data and CORE has no opinion about it: no rate is fixed in code, which
        ADR 0012 requires while regulatory pricing policy is undecided. Each
        grant's feature_key is an opaque string owned by the product that
        consumes it, never an enum or a column here (ADR 0018). limit_value
        MUST be present: null means granted without a quota and 0 means
        explicitly none, and those are opposites, so an omitted limit is
        refused rather than guessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, currency, amount_minor, billing_interval, grants]
              properties:
                code: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                amount_minor: { type: integer, minimum: 0 }
                billing_interval: { type: string, enum: [day, week, month, year] }
                interval_count: { type: integer, minimum: 1 }
                grants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [feature_key, limit_value]
                    properties:
                      feature_key: { type: string, minLength: 1 }
                      limit_value:
                        type: integer
                        minimum: 0
                        nullable: true
                        description: null means granted but unmetered; 0 means none.
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Draft plan created with its grants. No event is published, because terms that can still change are not a business fact anyone outside CORE can act on. }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List plans, optionally filtered by status
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, active, retired] }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Plans, newest first. }
        "400": { $ref: "#/components/responses/Error" }

  /v1/plans/{plan_id}:
    get:
      summary: Read one plan with its feature grants
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: The plan and its grants. }
        "404": { $ref: "#/components/responses/Error" }

  /v1/plans/{plan_id}/activate:
    post:
      summary: Activate a draft plan and freeze its terms
      description: >
        Idempotent on an already-active plan. Activation is one-way: an active
        plan cannot return to draft, because subscriptions may already price
        periods from it.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Plan active; terms and grants are now immutable. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/plans/{plan_id}/retire:
    post:
      summary: Stop new subscriptions to a plan without touching existing ones
      description: >
        Retiring closes the plan to new subscribers only. Subscriptions already
        on it keep renewing at the price their periods record, because the
        period is the invoice and carries its own amount. Retirement is
        one-way: reviving a plan would silently reopen terms that were
        withdrawn.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Plan retired; existing subscriptions are unaffected. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscriptions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Subscribe an owner to an active plan and open its first period
      description: >
        The subscription and its first period are committed first, and the
        first charge is attempted afterwards in its own unit of work. That
        split is deliberate: sharing one transaction would mean an empty wallet
        rolled the subscription away, leaving nothing to retry and inviting the
        caller to sign the same owner up twice. So a refused first charge still
        returns 201, with collected false and the subscription past_due. The
        wallet must exist, must belong to the same owner, and must hold the
        plan's currency - CORE does not convert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, plan_id, wallet_id]
              properties:
                owner_type: { type: string, enum: [identity, organization] }
                owner_id: { type: string, format: uuid }
                plan_id: { type: string, format: uuid }
                wallet_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Subscription created with its first period. collected reports whether the first charge was collected; false leaves the subscription past_due and the period retryable. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscriptions/{subscription_id}:
    get:
      summary: Read a subscription with its billing periods
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: The subscription and every period it has had, so its billing history can be read without reconstructing it from events. }
        "404": { $ref: "#/components/responses/Error" }

  /v1/subscriptions/{subscription_id}/cancel:
    post:
      summary: Cancel a subscription, keeping coverage to the end of a paid period
      description: >
        Cancellation is not expiry. If the current period is paid, coverage
        runs to its end and the subscription expires only then; if it was never
        paid, the period is voided and there is no coverage to keep. CORE
        applies no proration and issues no refund: what a mid-period
        cancellation is worth is a policy question with no owner decision yet,
        recorded in ROADMAP.md, and inventing one here would put money on an
        undecided rule.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Subscription cancelled. voided_period_id names the period voided when it had not been paid, otherwise null. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscriptions/{subscription_id}/usage:
    post:
      summary: Record metered usage against the period covering the instant
      description: >
        usage_reference is the reporter's idempotency key: at-least-once
        reporting counts once, and a repeat returns 200 with the original
        record rather than 201. Usage is recorded even once the grant's limit
        is passed - dropping over-quota consumption would leave the billing and
        dispute basis incomplete, and refusing further work is the entitlement
        decision's job, not the recorder's. Usage records cannot be changed or
        deleted afterwards through any route.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_key, quantity, usage_reference]
              properties:
                feature_key: { type: string, minLength: 1 }
                quantity: { type: integer, minimum: 1 }
                usage_reference: { type: string, minLength: 1 }
                at: { type: string, format: date-time }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Usage recorded for the first time. }
        "200": { description: The same usage_reference was already recorded; the original record is returned unchanged. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/subscription-periods/{period_id}/collect:
    post:
      summary: Attempt to collect a billing period through the ledger
      description: >
        Used to retry a period that could not be collected, and safe to call
        any number of times: the hold's business_reference is derived from the
        period id and ledger_transaction.business_reference is UNIQUE, so the
        ledger itself refuses a second movement. A refused collection is a
        recorded outcome rather than a transport failure, so it answers 200
        with collected false and a reason; the caller asked CORE to attempt a
        collection and CORE did. A successful collection on a past_due
        subscription returns it to active.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: period_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: The period after the attempt. collected reports whether money moved; reason carries why not when it did not. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/geography/countries:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: List reference countries
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Countries }
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register a reference country
      description: >
        The request body was undocumented until milestone 25, which declared what
        every write route accepts and cross-checked the declarations against this
        file. CORE has always required these three properties; only the contract
        was silent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, name, default_currency]
              properties:
                country_code: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                default_currency: { type: string, minLength: 1 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Country registered }
        "409": { $ref: "#/components/responses/Error" }
  /v1/geography/countries/{country_code}/regions:
    get:
      summary: List regions of a country
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: country_code
          in: path
          required: true
          schema: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Regions }
  /v1/geography/regions/{region_id}/cities:
    get:
      summary: List cities of a region
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: region_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Cities }
  /v1/geography/regions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register a reference region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, code, name]
              properties:
                country_code: { type: string, minLength: 1 }
                code: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Region registered }
  /v1/geography/cities:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register a reference city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region_id, name, latitude, longitude]
              properties:
                region_id: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: City registered }
  /v1/geography/service-areas:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register a service area with a coverage radius
      description: >
        centre_latitude and centre_longitude are optional: omitting both centres
        the area on its city, which is what this route has always done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id, name, radius_metres]
              properties:
                city_id: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                radius_metres: { type: number, minimum: 0 }
                centre_latitude: { type: number }
                centre_longitude: { type: number }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201": { description: Service area registered }
  /v1/geography/service-areas/resolve:
    get:
      summary: Resolve a coordinate to covering service areas
      description: Reference resolution only. CORE never stores tracking, routes or driver positions.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: latitude
          in: query
          required: true
          schema: { type: number }
        - name: longitude
          in: query
          required: true
          schema: { type: number }
        - name: country_code
          in: query
          required: false
          description: >
            Restricts resolution to one country. Implemented since the geography
            module shipped and undocumented until milestone 24, which compares
            this contract with the router's own declarations and found it.
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Matching service areas ordered by distance }
        "400": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/inconsistent:
    get:
      summary: List fulfillments whose execution state disagrees with their money state
      description: >-
        Reconciliation read. Returns fulfillments where execution state and
        settlement_state do not agree — for example a closed fulfillment whose
        hold could not be brought to a terminal state (settlement_state
        `unsettled`), or a failed or cancelled fulfillment whose hold had already
        moved part of the payer's money (`partially_captured`). An empty list is
        the invariant CORE is expected to hold.


        Each item also carries a derived `financial_disposition`
        (no_money, awaiting_execution, settled, decision_required,
        inconsistent), which says whether the case needs an engineer
        (`inconsistent`) or a business decision (`decision_required`). It is
        computed on read and never stored.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Count and list of inconsistent fulfillments }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/pending-financial-decision:
    get:
      summary: List fulfillments where money moved for work that did not complete
      description: >-
        Reconciliation read for the cases waiting on a decision rather than on a
        fix: execution closed as failed or cancelled while part of the payer's
        money had already moved (`settlement_state` `partially_captured`,
        `financial_disposition` `decision_required`).


        A non-empty list is not a CORE defect. CORE has recorded the money truth
        and stopped: it does not refund the amount, does not retain it as a
        cancellation fee, and does not mark the operation settled, because
        whether any of those is correct is undecided outside CORE (blocker
        B-20). The list exists so those cases are counted and visible instead of
        being mixed with bookkeeping defects.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Count and list of fulfillments awaiting a financial decision }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/reconciliation/stale-holds:
    get:
      summary: List open work whose money hold can no longer settle it
      description: >-
        Reconciliation read across two modules. Returns fulfillments that are
        still open while the authorization they name can no longer settle them —
        expired, voided, or captured out of band. Neither of the two reads above
        can find these, because both look only at the fulfillment row and the
        contradiction is between the fulfillment and the hold.


        This is not a false record and not a bookkeeping defect: the row says the
        work is open, which is true. It is a liveness condition, and CORE only
        reports it. Each item carries `reason` (why the hold is unusable, in the
        same vocabulary intake uses), `hold_captured_minor` (how much already
        moved), and `settlement_state_if_closed` (the settlement state this
        fulfillment would take if it closed now — which says in advance whether it
        will land in the pending-decision queue).


        CORE does not act on these. Re-authorising, abandoning the execution, or
        completing it unfunded are commercial answers CORE has not been given
        (dependency D-6), so the queue is reported and never drained
        automatically. The read mutates nothing.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: organization_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Count and list of open fulfillments with an unusable hold }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/{fulfillment_id}:
    get:
      summary: Read CORE fulfillment coordination state
      description: >-
        Returns opaque cross-system references, never order or job details.
        `status` is the execution state and `settlement_state` is its financial
        counterpart (none, held, captured, partially_captured, released,
        unsettled). `released` asserts that no money moved; `partially_captured`
        asserts that part of the consented amount moved and the remainder was
        released.


        The response also carries a derived `financial_disposition`: no_money,
        awaiting_execution, settled, decision_required or inconsistent.
        `decision_required` means money moved for work that did not complete and
        CORE has not been told what to do with it — do not present the operation
        as refunded or as settled while it says so.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: fulfillment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Fulfillment coordination record }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/fulfillments/{fulfillment_id}/cancel:
    post:
      summary: Cancel a fulfillment before execution closes (idempotent)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: fulfillment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: Cancelled fulfillment }
        "409": { description: Fulfillment already closed }
  /v1/events:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Submit an event from MARKET or MOVE for durable ingestion
      description: >-
        The edge external systems push into. CORE records the envelope durably
        and returns 202 without processing it; an inbound dispatcher hands it to
        the consumers afterwards, so a crash after the response loses nothing.
        Redelivering the same event_id is safe and returns first_delivery=false.

        Which event types a caller may submit is derived from the authenticated
        credential, not from the request. A caller may only submit events whose
        type carries its own prefix, and no external caller may submit core.*
        events at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventEnvelope" }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "202":
          description: Event accepted and recorded durably
          content:
            application/json:
              schema:
                type: object
                required: [event_id, accepted, first_delivery]
                properties:
                  event_id: { type: string, format: uuid }
                  accepted: { type: boolean }
                  first_delivery:
                    type: boolean
                    description: False when CORE already held this event; no retry needed.
        "400": { description: Invalid envelope, or no consumer for this event type }
        "403": { description: This caller may not submit this event type }
  /v1/event-subscriptions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register where CORE should deliver one of its own event types
      description: >-
        Operator-provisioned only; there is no self-registration. Only core.*
        event types may be subscribed to, because a subscription to market.* or
        move.* would hand one external system another's inbound traffic by
        configuration alone. The endpoint must be https, and the signing secret
        is never returned by any read path including this one.

        Re-registering an existing (subscriber, event_type) returns the existing
        subscription and does not rotate its secret: silently rotating would
        break every in-flight delivery without anyone asking for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriber, event_type, endpoint_url, signing_secret]
              properties:
                subscriber:
                  type: string
                  description: The external system, normally its service credential name.
                event_type: { type: string, pattern: "^core\\." }
                endpoint_url: { type: string, format: uri, pattern: "^https://" }
                signing_secret:
                  type: string
                  minLength: 32
                  description: >-
                    Shared secret CORE signs each body with. Write-only; stored
                    because HMAC needs the plaintext, never echoed, never logged.
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Subscription registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSubscription" }
        "400": { description: Not a core.* type, not https, or secret too short }
        "403": { description: Caller is not an operator }
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: List the endpoints CORE delivers events to
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Subscriptions, without their secrets
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventSubscription" }
        "403": { description: Caller is not an operator }
  /v1/event-subscriptions/{subscription_id}/deactivate:
    post:
      summary: Stop queueing new deliveries for a subscriber
      description: >-
        Deliveries already queued stay queued. They were promised, and dropping
        them silently is worse than delivering them late.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Subscription deactivated
          content:
            application/json:
              schema:
                type: object
                required: [subscription_id, active]
                properties:
                  subscription_id: { type: string, format: uuid }
                  active: { type: boolean }
        "403": { description: Caller is not an operator }
        "404": { description: No such subscription }
  /v1/event-subscriptions/{subscription_id}/activate:
    post:
      summary: Resume queueing deliveries for a subscriber
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Subscription activated
          content:
            application/json:
              schema:
                type: object
                required: [subscription_id, active]
                properties:
                  subscription_id: { type: string, format: uuid }
                  active: { type: boolean }
        "403": { description: Caller is not an operator }
        "404": { description: No such subscription }
  /v1/event-deliveries/undelivered:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: List what CORE has promised to deliver and has not
      description: >-
        Pending plus dead deliveries. An empty list is the invariant to expect;
        a dead row is one an operator has to look at, since CORE stopped trying.
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Outstanding deliveries
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventDelivery" }
        "403": { description: Caller is not an operator }
  /v1/notification-recipients:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register who is told about one CORE event type
      description: >-
        Binds an event type to an identity and one of its verified channels.
        Operator-only: deciding that a person receives messages about a tenant's
        events is an infrastructure decision with a privacy consequence, not a
        tenant setting.

        Only channels a person can receive on are accepted (telegram, email,
        phone), and only if the identity has a verified link on that channel —
        an unverified address is somebody's claim, not a confirmed destination.

        organization_id may only be set for event types whose payload carries
        the tenant (core.subscription.*, core.fulfillment.created). Closure
        events do not carry organization_id (blocker B-23), so a tenant-scoped
        recipient for them could never match and registration is refused rather
        than accepted into silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, identity_id, channel, correlation_id]
              properties:
                organization_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    Absent or null means platform-wide. Only permitted for event
                    types that carry a tenant.
                event_type: { type: string, pattern: "^core\\." }
                identity_id: { type: string, format: uuid }
                channel: { type: string, enum: [telegram, email, phone] }
                correlation_id: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          description: Recipient registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRecipient" }
        "400":
          description: >-
            Unknown or non-notifiable event type, unreceivable channel, no
            verified link on that channel, or a tenant scope the event cannot
            carry
        "403": { description: Caller is not an operator }
        "404": { description: Identity or organization not found }
    get:
      summary: List who is told about which events
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
          description: Restricts the list to one tenant's recipients.
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationRecipient" }
        "403": { description: Caller is not an operator }
  /v1/notification-recipients/{recipient_id}/deactivate:
    post:
      summary: Stop notifying a recipient about future events
      description: >-
        Notifications already queued stay queued. They describe something that
        already happened, and dropping them silently would lose a message CORE
        had already committed to sending.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: path
          name: recipient_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correlation_id]
              properties:
                correlation_id: { type: string }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Recipient deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRecipient" }
        "403": { description: Caller is not an operator }
        "404": { description: Recipient not found }
  /v1/notifications:
    get:
      summary: Inspect what people have been told, and what is stuck
      description: >-
        One list with filters plus the counts an operator watches, including the
        derived `retrying` state (a pending row that has already been attempted).
        There is deliberately no /pending, /failed or /retrying path: they are the
        same question with a different filter.

        This does not overlap /v1/event-deliveries/undelivered, which answers
        whether a subscribing *system* received an event. This answers whether a
        *person* was told.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [pending, processing, accepted, delivered, failed] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Notifications, newest first, with counts by state
          content:
            application/json:
              schema:
                type: object
                required: [count, summary, items]
                properties:
                  count: { type: integer }
                  summary:
                    type: object
                    description: Row counts per state, plus the derived retrying count.
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "400": { description: Unknown status or out-of-range limit }
        "403": { description: Caller is not an operator }
  /metrics:
    get:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Operational metrics in Prometheus text exposition format
      description: >
        System-level operational metrics: ingress volume, latency and status
        distribution, rate-limit refusals, worker claims and outcomes, queue
        depth, and the size of the reconciliation queues.

        Deliberately system-level only. No metric carries an organization or an
        entity dimension, so the exposition contains no tenant data, no
        identifier, no address and no credential — a count alone would otherwise
        reveal that a particular tenant exists and is in trouble. Per-tenant
        operational answers are served by the authorized reconciliation and
        delivery endpoints instead. See docs/observability.md.

        The scrape performs no query and changes no state; the queue-depth gauges
        are refreshed by a sampler on the operator's own cadence and carry
        core_sample_timestamp_seconds so their age is visible. Never rate
        limited, like the liveness probes. Unauthenticated, which requires the
        endpoint to stay on an internal network until the deployment topology is
        decided (blocker B-5).
      security: []
      responses:
        "200":
          description: Prometheus exposition, version 0.0.4. Deterministic for unchanged state.
          content:
            text/plain:
              schema: { type: string }

  /v1/reputation/{subject_type}/{subject_id}:
    get:
      summary: Read the derived standing of an identity or organization
      description: >
        Every number in the response is derived from the recorded signals at the
        moment of the read; no standing, score or average is stored anywhere in
        CORE. average_rating_milli is thousandths of a rating point and is null
        when the subject has no standing rating, which is not the same as a zero.
        Retracted signals are counted as retracted and count towards nothing
        else. CORE does not weight kinds, age signals or decide what standing is
        good enough for anything: those are product policy and are recorded as
        blockers in ROADMAP.md rather than invented here. There is no route that
        writes a signal - signals arrive only as events from the systems that
        observed them (ADR 0008, ADR 0015).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subject_type
          in: path
          required: true
          schema: { type: string, enum: [identity, organization] }
        - name: subject_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organization_id
          in: query
          required: true
          description: >
            The tenant of the read, stated rather than inferred from the
            caller's memberships: a principal can belong to several
            organizations, and inferring would mean CORE choosing which tenant an
            ambiguous read meant.
          schema: { type: string, format: uuid }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: The derived standing, with per-kind counts and the standing rating average. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/reputation/{subject_type}/{subject_id}/signals:
    get:
      summary: List the signals a standing is derived from
      description: >
        Newest first by CORE's own recorded_at, so one producer's clock skew
        cannot reorder another's facts. Bounded by limit, because an unbounded
        listing of a long history is a request whose cost nobody chose. Exists so
        a support agent can see what a number is made of instead of having to
        believe it; no review text ever reaches CORE, so none appears here.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subject_type
          in: path
          required: true
          schema: { type: string, enum: [identity, organization] }
        - name: subject_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200": { description: The recorded signals, newest first, each stating whether and when it was retracted. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: >
        The caller's trace id for this request. CORE echoes it in the response,
        writes it to the request log and persists it as the `correlation_id` of
        every audit, outbox, ledger, inbound-event, notification and subscription
        row the request creates, so it is accepted only as an identifier:
        letters, digits and `. _ : -`, at most 128 characters, sent at most once.
        Anything else is refused with 400 `invalid_request` before the route is
        matched, before the rate limiter runs and before any state is touched;
        the refusal carries a CORE-generated id rather than echoing the rejected
        value. Omit the header and CORE generates a UUID v4 for the request.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  responses:
    Error:
      description: Canonical error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >
        Too many requests from this credential for this route class within the
        current window. The request was refused at the HTTP edge before any
        handler ran, so it changed no state at all: no fulfillment, no ledger
        entry, no outbox or inbound row, no notification, no audit entry, and no
        idempotency consumed. `code` is `rate_limited` and `retryable` is true —
        distinct from `unavailable`, so a caller can tell "wait" from "broken".
        Wait for `retry-after` and resend the identical request.
      headers:
        retry-after:
          description: Whole seconds until the window resets, minimum 1 (RFC 9110).
          schema: { type: integer, minimum: 1 }
        x-ratelimit-limit:
          description: Requests allowed per window for this route class.
          schema: { type: integer, minimum: 1 }
        x-ratelimit-remaining:
          description: Requests left in the current window; 0 on a refusal.
          schema: { type: integer, minimum: 0 }
        x-ratelimit-reset:
          description: Unix time in seconds at which the current window ends.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    NotificationRecipient:
      type: object
      description: Who CORE tells about one event type, on which channel.
      required: [recipient_id, event_type, identity_id, channel, active, created_at]
      properties:
        recipient_id: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }
        event_type: { type: string }
        identity_id: { type: string, format: uuid }
        channel: { type: string, enum: [telegram, email, phone] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      description: >-
        One message to one person about one event. `accepted` means a provider
        took it; `delivered` means a provider confirmed it reached the recipient,
        which no adapter can report yet (dependency D-8). The distinction is kept
        in the model rather than collapsed, so a future provider callback does not
        require a migration of meaning.
      required:
        [notification_id, event_id, recipient_id, channel, template, status, attempts, created_at]
      properties:
        notification_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        recipient_id: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [telegram, email, phone] }
        address:
          type: string
          nullable: true
          description: Null only on a row born failed because the channel was unroutable.
        template: { type: string }
        subject: { type: string }
        body: { type: string }
        data: { type: object }
        idempotency_key:
          type: string
          description: >-
            event_id:recipient_id. Stable across retries and across dispatcher
            restarts, and passed to the adapter so a cooperating provider can
            collapse a repeat.
        status:
          type: string
          enum: [pending, processing, accepted, delivered, failed, retrying]
          description: >-
            `retrying` is derived, not stored: a pending row with attempts > 0.
        attempts: { type: integer }
        last_error:
          type: string
          nullable: true
          description: Provider failure reason, with secrets and addresses redacted.
        provider_message_id: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
    EventSubscription:
      type: object
      description: >-
        Where CORE delivers one event type. signing_secret is deliberately
        absent: it is write-only and never leaves the database.
      required: [subscription_id, subscriber, event_type, endpoint_url, active, created_at]
      properties:
        subscription_id: { type: string, format: uuid }
        subscriber: { type: string }
        event_type: { type: string }
        endpoint_url: { type: string, format: uri }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    EventDelivery:
      type: object
      description: One attempt record per (event, subscription). The unit of outbound work.
      required:
        [delivery_id, event_id, subscription_id, status, attempts, next_attempt_at, created_at]
      properties:
        delivery_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, delivered, dead]
          description: >-
            dead means CORE stopped trying: either the receiver refused the
            payload, or the attempt budget ran out.
        attempts: { type: integer }
        last_error: { type: string, nullable: true }
        last_status:
          type: integer
          nullable: true
          description: Null when the attempt never got a response at all.
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
    EventEnvelope:
      type: object
      description: >-
        The canonical envelope every event carries, inbound and outbound. The
        payload shape per event_type is published under contracts/events.
      required:
        [event_id, event_type, version, producer, occurred_at, correlation_id,
         entity_type, entity_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          description: >-
            Accepted from external callers: market.order.created,
            move.job.accepted, move.job.rejected, move.job.completed.
        version: { type: integer, minimum: 1 }
        producer:
          type: string
          description: Must equal the authenticated caller's service name.
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string }
        causation_id: { type: [string, "null"] }
        entity_type: { type: string }
        entity_id: { type: string }
        payload: { type: object }
    ChannelType:
      type: string
      enum: [telegram, phone, email, web, partner_api]
    Role:
      type: string
      enum: [platform_admin, org_admin, org_member, support_agent, service]
    Permission:
      type: string
      enum:
        - identity.read
        - identity.write
        - organization.read
        - organization.write
        - fulfillment.request
        - fulfillment.read
        - money.authorize
        - support.act
    IdentityResolved:
      type: object
      required: [identity_id, principal_id, status, created]
      properties:
        identity_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, merged] }
        created: { type: boolean }
    AuthenticatedPrincipal:
      type: object
      required: [principal_id, identity_id, session_id, organization_ids, roles, permissions]
      properties:
        principal_id: { type: string, format: uuid }
        identity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        organization_ids:
          type: array
          items: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Organization:
      type: object
      required: [organization_id, name, status, country_code]
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        country_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source_system: { type: string }
        legacy_id: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message, retryable, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              forbidden,
              not_found,
              conflict,
              precondition_failed,
              rate_limited,
              unavailable,
              internal,
            ]
        message: { type: string }
        details: { type: object }
        retryable: { type: boolean }
        correlation_id: { type: string }
