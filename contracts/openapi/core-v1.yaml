  /v1/notification-recipients:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Register who is told about one CORE event type
      description: >-
        Binds an event type to an identity and one of its verified channels.
        Operator-only: deciding that a person receives messages about a tenant's
        events is an infrastructure decision with a privacy consequence, not a
        tenant setting.

        Only channels a person can receive on are accepted (telegram, email,
        phone), and only if the identity has a verified link on that channel —
        an unverified address is somebody's claim, not a confirmed destination.

        organization_id may only be set for event types whose payload carries
        the tenant (core.subscription.*, core.fulfillment.created). Closure
        events do not carry organization_id (blocker B-23), so a tenant-scoped
        recipient for them could never match and registration is refused rather
        than accepted into silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, identity_id, channel, correlation_id]
              properties:
                organization_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    Absent or null means platform-wide. Only permitted for event
                    types that carry a tenant.
                event_type: { type: string, pattern: "^core\\." }
                identity_id: { type: string, format: uuid }
                channel: { type: string, enum: [telegram, email, phone] }
                correlation_id: { type: string }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Recipient registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRecipient" }
        "400":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: >-
            Unknown or non-notifiable event type, unreceivable channel, no
            verified link on that channel, or a tenant scope the event cannot
            carry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Identity or organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List who is told about which events
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
          description: Restricts the list to one tenant's recipients.
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationRecipient" }
        "403":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Caller is not an operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/notification-recipients/{recipient_id}/deactivate:
    post:
      summary: Stop notifying a recipient about future events
      description: >-
        Notifications already queued stay queued. They describe something that
        already happened, and dropping them silently would lose a message CORE
        had already committed to sending.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - in: path
          name: recipient_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correlation_id]
