              schema: { $ref: "#/components/schemas/PaymentAuthorization" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/plans:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      summary: Publish a new plan as a draft, with its feature grants
      description: >
        A plan is created as a draft and its commercial terms and grants can be
        edited only while it is one. Once activated they freeze: a price that
        could be edited after anyone had subscribed would make settled history
        unreadable, because the period would say one number and the plan
        another with nothing recording which the customer agreed to. Changing a
        price means publishing a new plan. amount_minor is operator-configured
        data and CORE has no opinion about it: no rate is fixed in code, which
        ADR 0012 requires while regulatory pricing policy is undecided. Each
        grant's feature_key is an opaque string owned by the product that
        consumes it, never an enum or a column here (ADR 0018). limit_value
        MUST be present: null means granted without a quota and 0 means
        explicitly none, and those are opposites, so an omitted limit is
        refused rather than guessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, currency, amount_minor, billing_interval, grants]
              properties:
                code: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                amount_minor: { type: integer, minimum: 0 }
                billing_interval: { type: string, enum: [day, week, month, year] }
                interval_count: { type: integer, minimum: 1 }
                grants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [feature_key, limit_value]
                    properties:
                      feature_key: { type: string, minLength: 1 }
                      limit_value:
                        type: integer
                        minimum: 0
                        nullable: true
                        description: null means granted but unmetered; 0 means none.
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Draft plan created with its grants. No event is published, because terms that can still change are not a business fact anyone outside CORE can act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List plans, optionally filtered by status
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, active, retired] }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          description: Plans, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Error" }

