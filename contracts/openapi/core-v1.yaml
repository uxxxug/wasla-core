  /v1/subscriptions:
    post:
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      summary: Subscribe an owner to an active plan and open its first period
      description: >
        The subscription and its first period are committed first, and the
        first charge is attempted afterwards in its own unit of work. That
        split is deliberate: sharing one transaction would mean an empty wallet
        rolled the subscription away, leaving nothing to retry and inviting the
        caller to sign the same owner up twice. So a refused first charge still
        returns 201, with collected false and the subscription past_due. The
        wallet must exist, must belong to the same owner, and must hold the
        plan's currency - CORE does not convert.


        A subscription is the most expensive duplicate CORE can make: a repeat
        of this call creates a second subscription on the same plan and the
        same wallet, and therefore a second recurring charge. Measured on main
        at bd92b69 a byte-identical repeat added a second subscription, a
        second period, a second payment authorization and a second ledger
        transaction.


        Retry safety, milestone 32. This route has no natural key that would
        make a repeat harmless, so it requires an `Idempotency-Key` header: a
        caller-chosen identifier, letters, digits and `. _ : -`, at most 128
        characters. **This is a breaking change** — a request without the
        header is refused with 400 `invalid_request`, and before milestone 32
        the header was ignored.


        CORE records this route's answer under the key together with a
        fingerprint of the request (its method, its route template and its
        parsed body). Sending the same key again with the same body returns the
        recorded status and body unchanged, with `idempotent-replay: true`, and
        creates nothing. Sending the same key with a different body is refused
        with 409 `conflict`, because the caller would otherwise be told a
        request it never made had succeeded. A refusal is never recorded, so a
        request rejected as invalid may be corrected and sent again under the
        same key. A record is replayed for 24 hours; after that the key is free
        again. The key is scoped to this route, so the same string used on a
        different route is a different record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, plan_id, wallet_id]
              properties:
                owner_type: { type: string, enum: [identity, organization] }
                owner_id: { type: string, format: uuid }
                plan_id: { type: string, format: uuid }
                wallet_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
      responses:
        "500": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "201":
          headers:
            x-correlation-id: { $ref: "#/components/headers/CorrelationId" }
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
            idempotent-replay: { $ref: "#/components/headers/IdempotentReplay" }
          description: Subscription created with its first period. collected reports whether the first charge was collected; false leaves the subscription past_due and the period retryable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Subscription"
                  - type: object
                    required: [current_period, collected]
                    properties:
                      current_period: { $ref: "#/components/schemas/SubscriptionPeriod" }
                      collected: { type: boolean }
                      uncollectible_reason: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/KeyReused" }

  /v1/subscriptions/{subscription_id}:
    get:
      summary: Read a subscription with its billing periods
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: subscription_id
          in: path
