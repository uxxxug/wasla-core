<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasla Core — لوحة العمليات</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #11161f;
      --surface-hover: #161c28;
      --border: #1e2533;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
      --orange: #e3b341;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }
    .header .meta {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 6px;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.red { background: var(--red); }
    .status-dot.yellow { background: var(--yellow); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card:hover { border-color: var(--text-dim); }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label {
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .stat-value.zero { color: var(--text-dim); }
    .stat-value.high { color: var(--yellow); }
    .stat-value.critical { color: var(--red); }
    .stat-age {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      display: block;
      text-align: end;
      margin-top: 2px;
    }
    .stat-age.stale { color: var(--yellow); }
    .stat-age.very-stale { color: var(--red); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.green { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge.yellow { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .badge.red { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .badge.blue { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
    .badge.purple { background: rgba(188, 140, 255, 0.15); color: var(--purple); }
    .blocker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      grid-column: 1 / -1;
    }
    .blocker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .blocker-item {
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .blocker-id {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange);
      margin-bottom: 4px;
    }
    .blocker-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .refresh-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }
    input[type="url"] {
      flex: 1;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: monospace;
    }
    input[type="url"]:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 8px 16px;
      background: var(--accent);
      color: #0a0e14;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .error-msg {
      color: var(--red);
      font-size: 13px;
      padding: 8px 0;
    }
    .section-divider {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Wasla Core — لوحة العمليات</h1>
    <div class="meta">
      <span id="last-sample">آخر تحديث: —</span>
      <span id="connection-status"><span class="status-dot yellow"></span>غير متصل</span>
    </div>
  </div>

  <div class="refresh-bar">
    <input type="url" id="metrics-url" placeholder="http://localhost:8080/metrics" value="http://localhost:8080/metrics">
    <button id="fetch-btn">تحديث</button>
    <button id="auto-btn" class="secondary">تحديث تلقائي</button>
  </div>
  <div id="error" class="error-msg"></div>

  <div class="grid" id="dashboard">
    <!-- Filled by JavaScript -->
  </div>

  <script>
    const BLOCKERS = [
      { id: "B-2", desc: "بيانات الإنتاج غير معروفة لحجم الجداول والتكرارات" },
      { id: "B-3", desc: "سياسة دمج الهويات المكررة غير محددة" },
      { id: "B-5", desc: "هدف وطوبولوجيا النشر غير محددة" },
      { id: "B-6", desc: "لا موافقة على النشر للإنتاج" },
      { id: "B-14", desc: "endpoint فحص الاستحقاق يحتاج ADR جديد" },
      { id: "B-15", desc: "سياسة الاسترداد الجزئي (proration) غير محددة" },
      { id: "B-16", desc: "سياسة فترة السماح (grace) غير محددة" },
      { id: "B-17", desc: "الفترات التجريبية (trial) غير محددة" },
      { id: "B-18", desc: "تراكم أو تجديد الحصص (quota) غير محدد" },
      { id: "B-19", desc: "تجاوزات الاستحقاق (comped) غير محددة" },
      { id: "B-20", desc: "خمس قرارات مالية عند فشل التسليم الجزئي" },
      { id: "B-30", desc: "ما يُدفع عند تسليم العمل بعد الإلغاء" },
      { id: "B-31", desc: "أوزان إشارات السمعة غير محددة" },
      { id: "B-32", desc: "تلاشي السمعة مع الوقت غير محدد" },
      { id: "B-33", desc: "حدود السمعة غير محددة" },
      { id: "B-34", desc: "عبور السمعة بين المؤسسات غير محدد" },
      { id: "B-35", desc: "قواعد التدهور (ADR 0010) غير مسجلة" },
      { id: "B-42", desc: "نطاق session.issue غير محدد" },
    ];

    function parseMetrics(text) {
      const values = {};
      for (const line of text.split('\n')) {
        if (!line || line.startsWith('#')) continue;
        const idx = line.lastIndexOf(' ');
        if (idx === -1) continue;
        values[line.slice(0, idx)] = Number(line.slice(idx + 1));
      }
      return values;
    }

    function getMetric(values, name, labels = {}) {
      const entries = Object.entries(labels);
      if (entries.length === 0) return values[name] ?? 0;
      const labelStr = entries.map(([k, v]) => `${k}="${v}"`).join(',');
      const key = `${name}{${labelStr}}`;
      return values[key] ?? 0;
    }

    function renderStatRow(label, value, badgeClass, badgeText) {
      const valClass = value === 0 ? 'stat-value zero' : value > 5 ? 'stat-value high' : 'stat-value';
      const badge = badgeText ? `<span class="badge ${badgeClass}">${badgeText}</span>` : '';
      return `
        <div class="stat-row">
          <span class="stat-label">${badge} ${label}</span>
          <span class="${valClass}">${value}</span>
        </div>`;
    }

    function formatAge(seconds) {
      if (!seconds || seconds <= 0) return null;
      if (seconds < 60) return `${Math.round(seconds)}ث`;
      const minutes = seconds / 60;
      if (minutes < 60) return `${Math.round(minutes)}د`;
      const hours = minutes / 60;
      if (hours < 24) return `${Math.round(hours)}س`;
      const days = hours / 24;
      return `${days.toFixed(1)}ي`;
    }

    function ageClass(seconds) {
      if (seconds >= 86400) return 'stat-age very-stale';
      if (seconds >= 3600) return 'stat-age stale';
      return 'stat-age';
    }

    function renderStatRowWithAge(label, value, ageSeconds) {
      const valClass = value === 0 ? 'stat-value zero' : value > 5 ? 'stat-value high' : 'stat-value';
      const ageText = value > 0 ? formatAge(ageSeconds) : null;
      const ageHtml = ageText ? `<span class="${ageClass(ageSeconds)}" title="عمر أقدم عنصر منذ إنشائه">أقدم: ${ageText}</span>` : '';
      return `
        <div class="stat-row">
          <span class="stat-label">${label}</span>
          <span class="${valClass}">${value}${ageHtml}</span>
        </div>`;
    }

    function renderDashboard(values) {
      const dash = document.getElementById('dashboard');
      let html = '';

      // Queue depths
      html += '<div class="section-divider">أعماق الطوابير</div>';

      const queues = ['outbox', 'inbound', 'event_delivery', 'notification'];
      const states = ['pending', 'published', 'processed', 'delivered', 'dead', 'retrying', 'failed'];
      for (const q of queues) {
        let rows = '';
        let total = 0;
        for (const s of states) {
          const v = getMetric(values, 'core_queue_depth', { queue: q, state: s });
          if (v > 0) { rows += renderStatRow(s, v, '', ''); total += v; }
        }
        if (!rows) rows = renderStatRow('فارغ', 0, 'green', 'OK');
        html += `<div class="card"><div class="card-title">${q} (${total})</div>${rows}</div>`;
      }

      // Reconciliation
      html += '<div class="section-divider">التسوية</div>';
      const recQueues = [
        { key: 'inconsistent', label: 'تناقضات مالية', critical: true },
        { key: 'pending_financial_decision', label: 'قرارات مالية معلقة', critical: true },
        { key: 'stale_holds', label: 'متجمدات قديمة', critical: false },
      ];
      let recRows = '';
      for (const rq of recQueues) {
        const v = getMetric(values, 'core_reconciliation_depth', { queue: rq.key });
        const badge = v > 0 ? `<span class="badge ${rq.critical ? 'red' : 'yellow'}">${rq.critical ? 'خطر' : 'انتباه'}</span>` : '<span class="badge green">OK</span>';
        recRows += renderStatRow(rq.label, v, '', '');
        // Replace the badge — simpler approach: just add it inline
      }
      html += `<div class="card"><div class="card-title">التسوية</div>${recRows}</div>`;

      // Fulfillment
      html += '<div class="section-divider">حالات الطلبات</div>';
      const fStatuses = [
        { key: 'coordinating', label: 'قيد التنسيق' },
        { key: 'dispatched', label: 'مُرسلة' },
        { key: 'completed', label: 'مكتملة' },
        { key: 'failed', label: 'فاشلة' },
        { key: 'cancelled', label: 'ملغاة' },
      ];
      let fRows = '';
      for (const fs of fStatuses) {
        const v = getMetric(values, 'core_fulfillment_depth', { status: fs.key });
        const age = getMetric(values, 'core_fulfillment_oldest_age_seconds', { status: fs.key });
        fRows += renderStatRowWithAge(fs.label, v, age);
      }
      html += `<div class="card"><div class="card-title">الطلبات</div>${fRows}</div>`;

      // Subscription
      const sStatuses = [
        { key: 'active', label: 'نشطة' },
        { key: 'past_due', label: 'متأخرة الدفع' },
        { key: 'cancelled', label: 'ملغاة' },
        { key: 'expired', label: 'منتهية' },
      ];
      let sRows = '';
      for (const ss of sStatuses) {
        const v = getMetric(values, 'core_subscription_depth', { status: ss.key });
        const age = getMetric(values, 'core_subscription_oldest_age_seconds', { status: ss.key });
        sRows += renderStatRowWithAge(ss.label, v, age);
      }
      html += `<div class="card"><div class="card-title">الاشتراكات</div>${sRows}</div>`;

      // Money
      const wStatuses = [
        { key: 'active', label: 'محافظ نشطة' },
        { key: 'frozen', label: 'محافظ مجمدة' },
        { key: 'closed', label: 'محافظ مغلقة' },
      ];
      let wRows = '';
      for (const ws of wStatuses) {
        const v = getMetric(values, 'core_money_depth', { kind: 'wallet', status: ws.key });
        const age = getMetric(values, 'core_money_oldest_age_seconds', { kind: 'wallet', status: ws.key });
        wRows += renderStatRowWithAge(ws.label, v, age);
      }
      html += `<div class="card"><div class="card-title">المحافظ</div>${wRows}</div>`;

      const aStatuses = [
        { key: 'authorized', label: 'تفويضات نشطة (مُحتجزة)' },
        { key: 'captured', label: 'مُخصومة بالكامل' },
        { key: 'partially_captured', label: 'مُخصومة جزئيًا' },
        { key: 'voided', label: 'مُلغاة' },
      ];
      let aRows = '';
      for (const as of aStatuses) {
        const v = getMetric(values, 'core_money_depth', { kind: 'payment_authorization', status: as.key });
        const age = getMetric(values, 'core_money_oldest_age_seconds', { kind: 'payment_authorization', status: as.key });
        aRows += renderStatRowWithAge(as.label, v, age);
      }
      html += `<div class="card"><div class="card-title">التفويضات المالية</div>${aRows}</div>`;

      // Sample timestamp
      const ts = getMetric(values, 'core_sample_timestamp_seconds', {});
      if (ts > 0) {
        const date = new Date(ts * 1000);
        document.getElementById('last-sample').textContent = `آخر تحديث: ${date.toLocaleString('ar-SA')}`;
      }

      // HTTP stats
      html += '<div class="section-divider">إحصائيات HTTP</div>';
      const httpTotal = Object.entries(values)
        .filter(([k]) => k.startsWith('core_http_requests_total{'))
        .reduce((sum, [, v]) => sum + v, 0);
      const rateLimited = Object.entries(values)
        .filter(([k]) => k.startsWith('core_http_rate_limited_total{'))
        .reduce((sum, [, v]) => sum + v, 0);
      const sampleFailures = getMetric(values, 'core_sample_failures_total', {});
      html += `<div class="card"><div class="card-title">HTTP</div>`;
      html += renderStatRow('إجمالي الطلبات', httpTotal, '', '');
      html += renderStatRow('محدودة بمعدل', rateLimited, '', '');
      html += renderStatRow('فشل أخذ العينات', sampleFailures, '', '');
      html += '</div>';

      // Worker stats
      const claims = Object.entries(values)
        .filter(([k]) => k.startsWith('core_worker_claims_total{'))
        .reduce((sum, [, v]) => sum + v, 0);
      const outcomes = Object.entries(values)
        .filter(([k]) => k.startsWith('core_worker_outcomes_total{'))
        .reduce((sum, [, v]) => sum + v, 0);
      html += `<div class="card"><div class="card-title">العمال</div>`;
      html += renderStatRow('مطالبات', claims, '', '');
      html += renderStatRow('نتائج', outcomes, '', '');
      html += '</div>';

      // Blockers
      html += '<div class="section-divider">القرارات المعلقة</div>';
      html += '<div class="blocker-card"><div class="card-title">القرارات الخارجية المعلقة</div>';
      html += '<div class="blocker-grid">';
      for (const b of BLOCKERS) {
        html += `<div class="blocker-item"><div class="blocker-id">${b.id}</div><div class="blocker-desc">${b.desc}</div></div>`;
      }
      html += '</div></div>';

      dash.innerHTML = html;
    }

    async function fetchMetrics() {
      const url = document.getElementById('metrics-url').value || 'http://localhost:3000/metrics';
      const errEl = document.getElementById('error');
      const statusEl = document.getElementById('connection-status');
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        const values = parseMetrics(text);
        renderDashboard(values);
        errEl.textContent = '';
        statusEl.innerHTML = '<span class="status-dot green"></span>متصل';
      } catch (e) {
        errEl.textContent = `تعذر الاتصال: ${e.message}. تأكد من أن CORE يعمل وأن العنوان صحيح.`;
        statusEl.innerHTML = '<span class="status-dot red"></span>غير متصل';
      }
    }

        // ── Demo mode ───────────────────────────────────────────────
    // When ?demo=1 is in the URL, the dashboard loads with realistic mock
    // data instead of trying to fetch /metrics. This is useful for previewing
    // the dashboard outside a CORE environment.
    function isDemoMode() {
      return new URLSearchParams(window.location.search).get('demo') === '1';
    }

    function loadDemoData() {
      const mock = `# HELP core_fulfillment_depth Fulfillments by status
# TYPE core_fulfillment_depth gauge
core_fulfillment_depth{status="coordinating"} 3
core_fulfillment_depth{status="dispatched"} 7
core_fulfillment_depth{status="completed"} 42
core_fulfillment_depth{status="failed"} 1
core_fulfillment_depth{status="cancelled"} 2
# HELP core_fulfillment_oldest_age_seconds Age of the oldest fulfillment by status
# TYPE core_fulfillment_oldest_age_seconds gauge
core_fulfillment_oldest_age_seconds{status="coordinating"} 86400
core_fulfillment_oldest_age_seconds{status="dispatched"} 7200
core_fulfillment_oldest_age_seconds{status="completed"} 3600
core_fulfillment_oldest_age_seconds{status="failed"} 1800
core_fulfillment_oldest_age_seconds{status="cancelled"} 0

# TYPE core_subscription_depth gauge

core_subscription_depth{status="past_due"} 4
core_subscription_depth{status="cancelled"} 1
core_subscription_depth{status="expired"} 0
# HELP core_subscription_oldest_age_seconds Age of the oldest subscription by status
# TYPE core_subscription_oldest_age_seconds gauge
core_subscription_oldest_age_seconds{status="active"} 259200
core_subscription_oldest_age_seconds{status="past_due"} 172800
core_subscription_oldest_age_seconds{status="cancelled"} 86400
core_subscription_oldest_age_seconds{status="expired"} 0
# HELP core_money_depth Wallets and payment authorizations by status
# TYPE core_money_depth gauge
core_money_depth{kind="wallet",status="active"} 12
core_money_depth{kind="wallet",status="frozen"} 1
core_money_depth{kind="wallet",status="closed"} 0
core_money_depth{kind="payment_authorization",status="authorized"} 8
core_money_depth{kind="payment_authorization",status="captured"} 3
core_money_depth{kind="payment_authorization",status="partially_captured"} 1
core_money_depth{kind="payment_authorization",status="voided"} 2
# HELP core_money_oldest_age_seconds Age of the oldest wallet/authorization by status
# TYPE core_money_oldest_age_seconds gauge
core_money_oldest_age_seconds{kind="wallet",status="active"} 129600
core_money_oldest_age_seconds{kind="wallet",status="frozen"} 43200
core_money_oldest_age_seconds{kind="wallet",status="closed"} 0
core_money_oldest_age_seconds{kind="payment_authorization",status="authorized"} 14400
core_money_oldest_age_seconds{kind="payment_authorization",status="captured"} 7200
core_money_oldest_age_seconds{kind="payment_authorization",status="partially_captured"} 10800
core_money_oldest_age_seconds{kind="payment_authorization",status="voided"} 0
# HELP core_queue_depth Queue depth by queue and state
# TYPE core_queue_depth gauge
core_queue_depth{queue="outbox",state="pending"} 5
core_queue_depth{queue="outbox",state="published"} 2
core_queue_depth{queue="inbound",state="pending"} 1
core_queue_depth{queue="event_delivery",state="delivered"} 10
core_queue_depth{queue="notification",state="pending"} 3
# HELP core_reconciliation_depth Reconciliation depth by queue
# TYPE core_reconciliation_depth gauge
core_reconciliation_depth{queue="inconsistent"} 2
core_reconciliation_depth{queue="pending_financial_decision"} 1
core_reconciliation_depth{queue="stale_holds"} 0
# HELP core_http_requests_total HTTP requests
# TYPE core_http_requests_total counter
core_http_requests_total{route="/metrics",method="get",status="200"} 42
core_http_rate_limited_total{route="/v1/money/credit",method="post"} 3
# HELP core_worker_claims_total Worker claims
# TYPE core_worker_claims_total counter
core_worker_claims_total{queue="outbox",worker="relay"} 100
# HELP core_worker_outcomes_total Worker outcomes
# TYPE core_worker_outcomes_total counter
core_worker_outcomes_total{queue="outbox",worker="relay",outcome="completed"} 95
# HELP core_sample_failures_total Sample failures
# TYPE core_sample_failures_total counter
core_sample_failures_total 0
# HELP core_sample_timestamp_seconds Last sample timestamp
# TYPE core_sample_timestamp_seconds gauge
core_sample_timestamp_seconds 1789528800`;
      const values = parseMetrics(mock);
      renderDashboard(values);
      document.getElementById('last-sample').textContent = 'آخر تحديث: ' + new Date(1789528800 * 1000).toLocaleString('ar-SA');
      document.getElementById('connection-status').innerHTML = '<span class="status-dot yellow"></span>وضع تجريبي';
      document.getElementById('error').textContent = 'وضع تجريبي — هذه بيانات افتراضية. افتح الصفحة بدون ?demo=1 للاتصال بـ CORE.';
    }

    document.getElementById('fetch-btn').addEventListener('click', fetchMetrics);
    document.getElementById('metrics-url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchMetrics();
    });

    let autoInterval = null;
    document.getElementById('auto-btn').addEventListener('click', (e) => {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        e.target.textContent = 'تحديث تلقائي';
        e.target.classList.add('secondary');
      } else {
        autoInterval = setInterval(fetchMetrics, 5000);
        e.target.textContent = 'إيقاف';
        e.target.classList.remove('secondary');
        fetchMetrics();
      }
    });

    // Initial fetch — demo mode if ?demo=1, otherwise try /metrics
    if (isDemoMode()) {
      loadDemoData();
    } else {
      fetchMetrics();
    }
  </script>
</body>
</html>
